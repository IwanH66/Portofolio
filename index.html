<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Portfolio - Industrial Engineer</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; scroll-behavior: smooth; }
        .animate-fade-in-up { animation: fadeInUp 0.8s ease-out forwards; }
        @keyframes fadeInUp {
          from { opacity: 0; transform: translateY(20px); }
          to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-[#F7F8FA]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- ICON COMPONENTS ---
        const IconMapPin = () => (
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
        );
        const IconMail = () => (
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
        );
        const IconDownload = () => (
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        );
        const IconClose = () => (
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        );
        const IconDashboard = () => (
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect></svg>
        );
        const IconEdit = () => (
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
        );
        const IconBriefcase = () => (
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
        );
        const IconFileText = () => (
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
        );

        // --- DATA AWAL (Akan dikirim ke Database saat pertama kali dijalankan) ---
        const initialData = {
          hero: {
            name: "Alexander Ryandi",
            headline: "Industrial & Manufacturing Engineer",
            description: "Specializing in lean manufacturing, production optimization, and continuous improvement. Transforming complex industrial challenges into scalable, efficient operational systems with over 8+ years of field experience.",
            location: "Jakarta, Indonesia",
            email: "alexander.eng@example.com",
            photoUrl: "https://placehold.co/600x800/101C2C/FFFFFF?text=AR",
            photoSettings: { zoom: 100, posX: 50, posY: 50 }
          },
          about: {
            summary: "A results-driven Industrial Engineer with a proven track record of increasing production efficiency by 35% through Lean Six Sigma methodologies. Adept at cross-functional team leadership, supply chain integration, and deploying data-driven quality management systems.",
            education: "B.Sc. in Industrial Engineering - Institut Teknologi Bandung (ITB)",
            focus: "Production Planning (PPIC), Quality Control, and Process Automation."
          },
          experience: [
            {
              id: 1,
              company: "Astra International",
              role: "Senior Process Engineer",
              period: "2020 - Present",
              location: "Jakarta",
              description: "Leading the process optimization for automotive parts manufacturing lines.",
              achievements: [
                "Reduced cycle time by 15% using time-motion studies.",
                "Implemented automated quality inspection reducing defect rate to < 0.5%."
              ]
            }
          ],
          projects: [
            {
              id: 1,
              title: "Lean Assembly Line Transformation",
              category: "Continuous Improvement",
              summary: "Redesign of the main assembly line to minimize bottlenecks and worker fatigue.",
              cover: "https://placehold.co/800x500/172B45/FFFFFF?text=Lean+Assembly",
              tools: ["AutoCAD", "Minitab", "Six Sigma"],
              detail: {
                background: "The existing assembly line had a 20% idle time due to uneven task distribution.",
                objectives: "Balance the line, reduce takt time, and improve ergonomics.",
                methodology: "Value Stream Mapping (VSM), Line Balancing, 5S.",
                results: "Increased daily output by 400 units, reduced overtime costs by 25%."
              }
            }
          ]
        };

        // --- 1. PUBLIC PORTFOLIO COMPONENT ---
        const PublicPortfolio = ({ data, setView }) => {
          const [activeProject, setActiveProject] = useState(null);
          const [activeCategory, setActiveCategory] = useState('All');

          // Secret shortcut (P + L) to open admin
          useEffect(() => {
            const keysPressed = {};
            const handleKeyDown = (e) => {
              keysPressed[e.key.toLowerCase()] = true;
              if (keysPressed['p'] && keysPressed['l']) {
                setView('admin');
                keysPressed['p'] = false;
                keysPressed['l'] = false;
              }
            };
            const handleKeyUp = (e) => {
              keysPressed[e.key.toLowerCase()] = false;
            };
            
            window.addEventListener('keydown', handleKeyDown);
            window.addEventListener('keyup', handleKeyUp);
            
            return () => {
              window.removeEventListener('keydown', handleKeyDown);
              window.removeEventListener('keyup', handleKeyUp);
            };
          }, [setView]);

          const categories = ['All', ...new Set(data.projects.map(p => p.category))];
          const filteredProjects = activeCategory === 'All' 
            ? data.projects 
            : data.projects.filter(p => p.category === activeCategory);

          return (
            <div className="min-h-screen font-sans text-[#101C2C] selection:bg-[#3478F6] selection:text-white">
              <nav className="fixed w-full top-0 bg-white/80 backdrop-blur-md z-40 border-b border-gray-200">
                <div className="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
                  <div className="font-bold text-xl tracking-tighter text-[#101C2C]">
                    {data.hero.name.split(' ')[0]}<span className="text-[#3478F6]">.</span>
                  </div>
                  <div className="hidden md:flex space-x-8 text-sm font-medium text-[#64748B]">
                    <a href="#about" className="hover:text-[#101C2C] transition-colors">About</a>
                    <a href="#experience" className="hover:text-[#101C2C] transition-colors">Experience</a>
                    <a href="#projects" className="hover:text-[#101C2C] transition-colors">Projects</a>
                  </div>
                  <a href="#contact" className="px-5 py-2 bg-[#101C2C] text-white text-sm font-medium rounded hover:bg-[#3478F6] transition-colors">
                    Contact Me
                  </a>
                </div>
              </nav>

              <section className="pt-28 pb-12 px-6 max-w-7xl mx-auto flex flex-col-reverse md:flex-row items-center gap-10 md:gap-16 min-h-[90vh]">
                <div className="flex-1 space-y-6 md:space-y-8 animate-fade-in-up text-center md:text-left flex flex-col items-center md:items-start">
                  <div className="space-y-3 md:space-y-4">
                    <h2 className="text-[#3478F6] font-semibold tracking-wider text-xs md:text-sm uppercase">Portfolio & Curriculum Vitae</h2>
                    <h1 className="text-4xl sm:text-5xl md:text-7xl font-extrabold tracking-tight leading-[1.1] text-[#101C2C]">
                      {data.hero.name}
                    </h1>
                    <p className="text-xl md:text-2xl text-[#64748B] font-light">
                      {data.hero.headline}
                    </p>
                  </div>
                  
                  <p className="text-base md:text-lg text-[#64748B] leading-relaxed max-w-xl">
                    {data.hero.description}
                  </p>
                  
                  <div className="flex flex-col sm:flex-row gap-3 md:gap-4 items-center w-full sm:w-auto">
                    <span className="flex items-center justify-center text-xs md:text-sm font-medium text-[#101C2C] bg-white px-4 py-2 rounded shadow-sm border border-gray-100 w-full sm:w-auto">
                      <span className="mr-2 text-[#3478F6]"><IconMapPin /></span> {data.hero.location}
                    </span>
                    <a href={`mailto:${data.hero.email}`} className="flex items-center justify-center text-xs md:text-sm font-medium text-[#101C2C] bg-white px-4 py-2 rounded shadow-sm border border-gray-100 hover:text-[#3478F6] transition-colors w-full sm:w-auto">
                      <span className="mr-2 text-[#3478F6]"><IconMail /></span> {data.hero.email}
                    </a>
                  </div>

                  <div className="flex flex-col sm:flex-row gap-3 md:gap-4 pt-4 w-full sm:w-auto">
                    <a href="#projects" className="px-8 py-3 md:py-4 bg-[#3478F6] text-white font-medium rounded hover:bg-[#172B45] transition-colors shadow-lg shadow-blue-500/20 text-center">
                      View Portfolio
                    </a>
                    <button className="flex items-center justify-center px-8 py-3 md:py-4 bg-white text-[#101C2C] font-medium rounded border border-gray-200 hover:border-[#3478F6] transition-colors">
                      <span className="mr-2"><IconDownload /></span> Download CV
                    </button>
                  </div>
                </div>
                
                <div className="flex-1 w-full flex justify-center md:justify-end relative">
                  <div className="absolute inset-0 bg-[#3478F6] rounded transform translate-x-4 translate-y-4 opacity-10 hidden md:block"></div>
                  <div className="w-2/3 max-w-[280px] md:w-full md:max-w-md rounded shadow-2xl relative z-10 overflow-hidden filter grayscale hover:grayscale-0 transition-all duration-700 aspect-[3/4]">
                    <img 
                      src={data.hero.photoUrl} 
                      alt="Profile" 
                      className="w-full h-full object-cover"
                      style={{
                        objectPosition: `${data.hero.photoSettings?.posX || 50}% ${data.hero.photoSettings?.posY || 50}%`,
                        transform: `scale(${(data.hero.photoSettings?.zoom || 100) / 100})`
                      }}
                    />
                  </div>
                </div>
              </section>

              <section id="about" className="py-20 bg-white border-y border-gray-100">
                <div className="max-w-7xl mx-auto px-6 grid md:grid-cols-12 gap-12">
                  <div className="md:col-span-4">
                    <h2 className="text-3xl font-bold text-[#101C2C] mb-6">About Architecture</h2>
                    <div className="h-1 w-20 bg-[#3478F6]"></div>
                  </div>
                  <div className="md:col-span-8 space-y-8">
                    <p className="text-xl leading-relaxed text-[#101C2C] font-medium">
                      {data.about.summary}
                    </p>
                    <div className="grid sm:grid-cols-2 gap-8 pt-8 border-t border-gray-100">
                      <div>
                        <h4 className="text-sm text-[#64748B] uppercase tracking-wider mb-2">Education</h4>
                        <p className="font-medium text-[#101C2C]">{data.about.education}</p>
                      </div>
                      <div>
                        <h4 className="text-sm text-[#64748B] uppercase tracking-wider mb-2">Career Focus</h4>
                        <p className="font-medium text-[#101C2C]">{data.about.focus}</p>
                      </div>
                    </div>
                  </div>
                </div>
              </section>

              <section id="experience" className="py-24 px-6 max-w-7xl mx-auto">
                <h2 className="text-4xl font-bold text-[#101C2C] mb-16 text-center">Professional Timeline</h2>
                <div className="space-y-12">
                  {data.experience.map((exp) => (
                    <div key={exp.id} className="relative pl-8 md:pl-0">
                      <div className="md:grid md:grid-cols-5 md:gap-8 items-start">
                        <div className="hidden md:block col-span-1 text-right pt-1">
                          <div className="text-lg font-bold text-[#101C2C]">{exp.period}</div>
                          <div className="text-sm text-[#64748B]">{exp.location}</div>
                        </div>
                        <div className="absolute left-0 md:left-1/5 md:-ml-[17px] top-2 bottom-0 w-px bg-gray-200"></div>
                        <div className="absolute left-[-4px] md:left-1/5 md:-ml-[21px] top-2 w-2 h-2 rounded-full bg-[#3478F6] ring-4 ring-[#F7F8FA]"></div>
                        
                        <div className="md:col-span-4 bg-white p-8 rounded border border-gray-100 shadow-sm hover:shadow-md transition-shadow group">
                          <div className="md:hidden mb-4">
                            <div className="text-sm font-bold text-[#3478F6]">{exp.period}</div>
                          </div>
                          <h3 className="text-2xl font-bold text-[#101C2C] mb-1">{exp.role}</h3>
                          <h4 className="text-lg text-[#64748B] mb-4">{exp.company}</h4>
                          <p className="text-[#64748B] mb-6">{exp.description}</p>
                          <ul className="space-y-2">
                            {exp.achievements.map((ach, idx) => (
                              <li key={idx} className="flex items-start">
                                <span className="text-[#3478F6] mr-3 mt-1">✦</span>
                                <span className="text-[#101C2C] text-sm leading-relaxed">{ach}</span>
                              </li>
                            ))}
                          </ul>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </section>

              <section id="projects" className="py-24 bg-[#101C2C] text-white">
                <div className="max-w-7xl mx-auto px-6">
                  <div className="flex flex-col md:flex-row justify-between items-end mb-12">
                    <div>
                      <h2 className="text-4xl font-bold mb-4">Selected Projects</h2>
                      <p className="text-[#64748B]">Engineering solutions and measurable impacts.</p>
                    </div>
                    <div className="flex flex-wrap gap-2 mt-6 md:mt-0">
                      {categories.map(cat => (
                        <button 
                          key={cat}
                          onClick={() => setActiveCategory(cat)}
                          className={`px-4 py-2 text-sm rounded transition-colors ${
                            activeCategory === cat 
                              ? 'bg-[#3478F6] text-white' 
                              : 'bg-[#172B45] text-[#64748B] hover:text-white'
                          }`}
                        >
                          {cat}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="grid md:grid-cols-2 gap-8">
                    {filteredProjects.map(proj => (
                      <div 
                        key={proj.id} 
                        className="group cursor-pointer bg-[#172B45] rounded overflow-hidden"
                        onClick={() => setActiveProject(proj)}
                      >
                        <div className="relative h-64 overflow-hidden">
                          <div className="absolute inset-0 bg-[#101C2C]/20 group-hover:bg-transparent transition-colors z-10"></div>
                          <img 
                            src={proj.cover} 
                            alt={proj.title} 
                            className="w-full h-full object-cover transform group-hover:scale-105 transition-transform duration-500"
                          />
                        </div>
                        <div className="p-8">
                          <div className="text-xs font-bold text-[#3478F6] uppercase tracking-wider mb-2">{proj.category}</div>
                          <h3 className="text-2xl font-bold mb-3 group-hover:text-[#3478F6] transition-colors">{proj.title}</h3>
                          <p className="text-[#64748B] mb-6 line-clamp-2">{proj.summary}</p>
                          <div className="flex flex-wrap gap-2">
                            {proj.tools.map(tool => (
                              <span key={tool} className="text-xs px-2 py-1 border border-[#64748B]/30 text-[#64748B] rounded">
                                {tool}
                              </span>
                            ))}
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </section>

              {activeProject && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6">
                  <div className="absolute inset-0 bg-[#101C2C]/80 backdrop-blur-sm" onClick={() => setActiveProject(null)}></div>
                  <div className="relative bg-white w-full max-w-4xl max-h-[90vh] overflow-y-auto rounded shadow-2xl animate-fade-in-up">
                    <button 
                      onClick={() => setActiveProject(null)}
                      className="absolute top-6 right-6 p-2 bg-gray-100 hover:bg-gray-200 rounded-full text-[#101C2C] transition-colors z-10"
                    >
                      <IconClose />
                    </button>
                    <div className="h-64 sm:h-80 relative">
                      <img src={activeProject.cover} alt={activeProject.title} className="w-full h-full object-cover" />
                    </div>
                    <div className="p-8 md:p-12">
                      <div className="text-sm font-bold text-[#3478F6] uppercase tracking-wider mb-2">{activeProject.category}</div>
                      <h2 className="text-3xl font-bold text-[#101C2C] mb-8">{activeProject.title}</h2>
                      
                      <div className="grid md:grid-cols-2 gap-12">
                        <div className="space-y-8">
                          <div>
                            <h4 className="text-lg font-bold text-[#101C2C] border-b border-gray-200 pb-2 mb-3">Background</h4>
                            <p className="text-[#64748B] leading-relaxed">{activeProject.detail.background}</p>
                          </div>
                          <div>
                            <h4 className="text-lg font-bold text-[#101C2C] border-b border-gray-200 pb-2 mb-3">Methodology</h4>
                            <p className="text-[#64748B] leading-relaxed">{activeProject.detail.methodology}</p>
                          </div>
                        </div>
                        <div className="space-y-8">
                          <div>
                            <h4 className="text-lg font-bold text-[#101C2C] border-b border-gray-200 pb-2 mb-3">Objectives</h4>
                            <p className="text-[#64748B] leading-relaxed">{activeProject.detail.objectives}</p>
                          </div>
                          <div className="bg-[#F7F8FA] p-6 rounded border border-gray-200">
                            <h4 className="text-lg font-bold text-[#3478F6] mb-3">Key Results</h4>
                            <p className="text-[#101C2C] font-medium leading-relaxed">{activeProject.detail.results}</p>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              <footer className="bg-[#101C2C] py-8 border-t border-[#172B45] text-center">
                <p className="text-[#64748B] text-sm">© {new Date().getFullYear()} {data.hero.name}. All rights reserved.</p>
              </footer>
            </div>
          );
        };

        // --- 2. ADMIN DASHBOARD COMPONENT ---
        const AdminDashboard = ({ data, setData, setView }) => {
          const [activeTab, setActiveTab] = useState('Hero');
          const [formData, setFormData] = useState(data);
          const [notification, setNotification] = useState('');

          const handleNestedChange = (section, field, value) => {
            setFormData({
              ...formData,
              [section]: {
                ...formData[section],
                [field]: value
              }
            });
          };

          const handleSave = async () => {
            try {
                await setData(formData);
                setNotification('✅ Berhasil! Perubahan tersimpan permanen di Firebase.');
            } catch(e) {
                setNotification('❌ Terjadi kesalahan saat menyimpan.');
            }
            // Hilangkan notifikasi setelah 3 detik
            setTimeout(() => setNotification(''), 3500);
          };

          return (
            <div className="flex h-screen bg-[#F4F6F9] font-sans text-sm relative">
              
              {/* Notification Pop-up */}
              {notification && (
                <div className="absolute top-4 left-1/2 transform -translate-x-1/2 z-50 bg-[#101C2C] text-white px-6 py-3 rounded shadow-lg animate-fade-in-up font-medium">
                  {notification}
                </div>
              )}

              <div className="w-64 bg-white border-r border-gray-200 flex flex-col shadow-sm z-10">
                <div className="h-16 flex items-center px-6 border-b border-gray-200">
                  <div className="font-bold text-lg text-[#EE4D2D]">Workspace<span className="text-[#101C2C]">Admin</span></div>
                </div>
                <div className="flex-1 overflow-y-auto py-4">
                  <div className="px-6 mb-2 text-xs font-bold text-gray-400 uppercase tracking-wider">Content Management</div>
                  <nav className="space-y-1">
                    {[
                      { id: 'Hero', icon: <IconDashboard />, label: 'Hero Section' },
                      { id: 'About', icon: <IconFileText />, label: 'About & Info' },
                      { id: 'Experience', icon: <IconBriefcase />, label: 'Experiences' },
                      { id: 'Projects', icon: <IconEdit />, label: 'Manage Projects' },
                    ].map((item) => (
                      <button
                        key={item.id}
                        onClick={() => setActiveTab(item.id)}
                        className={`w-full flex items-center px-6 py-3 transition-colors ${
                          activeTab === item.id 
                            ? 'bg-[#EE4D2D]/10 text-[#EE4D2D] border-r-4 border-[#EE4D2D]' 
                            : 'text-gray-600 hover:bg-gray-50'
                        }`}
                      >
                        <span className="mr-3">{item.icon}</span>
                        {item.label}
                      </button>
                    ))}
                  </nav>
                </div>
                <div className="p-4 border-t border-gray-200">
                  <button 
                    onClick={() => setView('public')}
                    className="w-full py-2 text-center text-[#64748B] bg-gray-100 hover:bg-gray-200 rounded font-medium transition-colors"
                  >
                    Exit to Website
                  </button>
                </div>
              </div>

              <div className="flex-1 flex flex-col overflow-hidden">
                <header className="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-8 shadow-sm z-0">
                  <h1 className="text-xl font-bold text-gray-800">
                    {activeTab === 'Hero' && 'Edit Hero Section'}
                    {activeTab === 'About' && 'Edit About Information'}
                    {activeTab === 'Experience' && 'Manage Work Experiences'}
                    {activeTab === 'Projects' && 'Manage Projects'}
                  </h1>
                  <div className="flex space-x-4">
                    <button 
                      onClick={() => setFormData(data)} 
                      className="px-4 py-2 border border-gray-300 text-gray-700 rounded hover:bg-gray-50 font-medium"
                    >
                      Discard Changes
                    </button>
                    <button 
                      onClick={handleSave} 
                      className="px-6 py-2 bg-[#EE4D2D] text-white rounded hover:bg-[#D74325] font-medium shadow-md shadow-[#EE4D2D]/20 transition-all"
                    >
                      Save & Publish
                    </button>
                  </div>
                </header>

                <main className="flex-1 overflow-y-auto p-8">
                  <div className="bg-white rounded border border-gray-200 shadow-sm max-w-4xl">
                    {activeTab === 'Hero' && (
                      <div className="p-8 space-y-6">
                        
                        <div className="grid grid-cols-2 gap-6">
                          <div className="space-y-2">
                            <label className="block font-medium text-gray-700">Nama Lengkap</label>
                            <input type="text" value={formData.hero.name} onChange={(e) => handleNestedChange('hero', 'name', e.target.value)} className="w-full px-4 py-2 border border-gray-300 rounded outline-none focus:border-[#EE4D2D]" />
                          </div>
                          <div className="space-y-2">
                            <label className="block font-medium text-gray-700">Headline Profesional</label>
                            <input type="text" value={formData.hero.headline} onChange={(e) => handleNestedChange('hero', 'headline', e.target.value)} className="w-full px-4 py-2 border border-gray-300 rounded outline-none focus:border-[#EE4D2D]" />
                          </div>
                        </div>
                        
                        <div className="space-y-2">
                            <label className="block font-medium text-gray-700">Deskripsi Singkat</label>
                            <textarea rows="3" value={formData.hero.description} onChange={(e) => handleNestedChange('hero', 'description', e.target.value)} className="w-full px-4 py-2 border border-gray-300 rounded outline-none focus:border-[#EE4D2D] resize-none"></textarea>
                        </div>

                        <div className="grid grid-cols-2 gap-6">
                          <div className="space-y-2">
                            <label className="block font-medium text-gray-700">Location</label>
                            <input type="text" value={formData.hero.location} onChange={(e) => handleNestedChange('hero', 'location', e.target.value)} className="w-full px-4 py-2 border border-gray-300 rounded outline-none" />
                          </div>
                          <div className="space-y-2">
                            <label className="block font-medium text-gray-700">Email Address</label>
                            <input type="email" value={formData.hero.email} onChange={(e) => handleNestedChange('hero', 'email', e.target.value)} className="w-full px-4 py-2 border border-gray-300 rounded outline-none" />
                          </div>
                        </div>

                        {/* FOTO & CROP SETTINGS */}
                        <div className="bg-gray-50 p-6 rounded border border-gray-200 mt-6">
                          <h3 className="font-bold text-gray-800 mb-4 flex items-center"><span className="mr-2">🖼️</span> Pengaturan Foto Profil (G-Drive / Web Link)</h3>
                          
                          <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div className="space-y-4">
                              <div className="space-y-2">
                                <label className="block font-medium text-gray-700 text-sm">Direct Link Foto</label>
                                <input 
                                  type="text" 
                                  placeholder="Paste link gambar di sini..."
                                  value={formData.hero.photoUrl} 
                                  onChange={(e) => handleNestedChange('hero', 'photoUrl', e.target.value)} 
                                  className="w-full px-4 py-2 border border-gray-300 rounded outline-none" 
                                />
                              </div>

                              <div className="space-y-2">
                                <label className="flex justify-between font-medium text-gray-700 text-sm">
                                  <span>Zoom (Scale)</span>
                                  <span className="text-[#EE4D2D]">{formData.hero.photoSettings?.zoom || 100}%</span>
                                </label>
                                <input 
                                  type="range" min="50" max="250" 
                                  value={formData.hero.photoSettings?.zoom || 100} 
                                  onChange={(e) => handleNestedChange('hero', 'photoSettings', { ...(formData.hero.photoSettings || {zoom:100,posX:50,posY:50}), zoom: e.target.value })}
                                  className="w-full cursor-ew-resize accent-[#EE4D2D]"
                                />
                              </div>

                              <div className="space-y-2">
                                <label className="flex justify-between font-medium text-gray-700 text-sm">
                                  <span>Geser Horizontal (X)</span>
                                  <span className="text-[#EE4D2D]">{formData.hero.photoSettings?.posX || 50}%</span>
                                </label>
                                <input 
                                  type="range" min="0" max="100" 
                                  value={formData.hero.photoSettings?.posX || 50} 
                                  onChange={(e) => handleNestedChange('hero', 'photoSettings', { ...(formData.hero.photoSettings || {zoom:100,posX:50,posY:50}), posX: e.target.value })}
                                  className="w-full cursor-ew-resize accent-[#EE4D2D]"
                                />
                              </div>

                              <div className="space-y-2">
                                <label className="flex justify-between font-medium text-gray-700 text-sm">
                                  <span>Geser Vertikal (Y)</span>
                                  <span className="text-[#EE4D2D]">{formData.hero.photoSettings?.posY || 50}%</span>
                                </label>
                                <input 
                                  type="range" min="0" max="100" 
                                  value={formData.hero.photoSettings?.posY || 50} 
                                  onChange={(e) => handleNestedChange('hero', 'photoSettings', { ...(formData.hero.photoSettings || {zoom:100,posX:50,posY:50}), posY: e.target.value })}
                                  className="w-full cursor-ew-resize accent-[#EE4D2D]"
                                />
                              </div>
                            </div>
                            
                            <div className="flex flex-col items-center justify-center">
                              <p className="font-medium text-gray-700 text-sm mb-2">Live Preview Area</p>
                              <div className="w-[180px] h-[240px] bg-gray-200 rounded shadow-inner overflow-hidden relative border border-gray-300">
                                <img 
                                  src={formData.hero.photoUrl} 
                                  alt="Preview" 
                                  className="w-full h-full object-cover"
                                  style={{
                                    objectPosition: `${formData.hero.photoSettings?.posX || 50}% ${formData.hero.photoSettings?.posY || 50}%`,
                                    transform: `scale(${(formData.hero.photoSettings?.zoom || 100) / 100})`
                                  }}
                                />
                              </div>
                            </div>
                          </div>
                        </div>

                      </div>
                    )}

                    {activeTab === 'About' && (
                      <div className="p-8 space-y-6">
                         <div className="space-y-2">
                          <label className="block font-medium text-gray-700">Professional Summary</label>
                          <textarea rows="5" value={formData.about.summary} onChange={(e) => handleNestedChange('about', 'summary', e.target.value)} className="w-full px-4 py-2 border border-gray-300 rounded outline-none resize-none"></textarea>
                        </div>
                        <div className="space-y-2">
                          <label className="block font-medium text-gray-700">Education Details</label>
                          <input type="text" value={formData.about.education} onChange={(e) => handleNestedChange('about', 'education', e.target.value)} className="w-full px-4 py-2 border border-gray-300 rounded outline-none" />
                        </div>
                        <div className="space-y-2">
                          <label className="block font-medium text-gray-700">Career Focus Areas</label>
                          <input type="text" value={formData.about.focus} onChange={(e) => handleNestedChange('about', 'focus', e.target.value)} className="w-full px-4 py-2 border border-gray-300 rounded outline-none" />
                        </div>
                      </div>
                    )}

                    {(activeTab === 'Experience' || activeTab === 'Projects') && (
                      <div className="p-8 flex flex-col items-center justify-center text-center text-gray-500 py-20">
                        <IconBriefcase />
                        <p className="mt-4 font-medium">This module is connected to the array data structure.</p>
                      </div>
                    )}
                  </div>
                </main>
              </div>
            </div>
          );
        };

        // --- 3. MAIN APP WRAPPER & FIREBASE INTEGRATION ---
        const App = () => {
          const [view, setView] = useState('public');
          const [portfolioData, setPortfolioData] = useState(initialData);
          const [db, setDb] = useState(null);
          
          // ID untuk folder database Anda
          const appId = "portooooo-8ffd1";

          useEffect(() => {
            const initFirebase = async () => {
              try {
                // Import SDK Firebase (HANYA APP & FIRESTORE)
                const { initializeApp } = await import('https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js');
                const { getFirestore, doc, onSnapshot, setDoc, getDoc } = await import('https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js');

                // KODE FIREBASE ANDA
                const firebaseConfig = {
                  apiKey: "AIzaSyB0gq5a09YMfxIHCDJUa833CuS6JM4-r0M",
                  authDomain: "portooooo-8ffd1.firebaseapp.com",
                  projectId: "portooooo-8ffd1",
                  storageBucket: "portooooo-8ffd1.firebasestorage.app",
                  messagingSenderId: "806835327046",
                  appId: "1:806835327046:web:3e2a28f0a806291200ba47",
                  measurementId: "G-4NHWXXMKMH"
                };

                const app = initializeApp(firebaseConfig);
                const firestoreDb = getFirestore(app);
                setDb(firestoreDb);
                
                // 1. Tentukan Alamat Dokumen di Database Anda
                const docRef = doc(firestoreDb, 'artifacts', appId, 'public', 'data', 'main');

                // 2. AUTO-SEED: Cek apakah DB masih kosong? Jika ya, isi dengan initialData
                const docSnap = await getDoc(docRef);
                if (!docSnap.exists()) {
                    await setDoc(docRef, initialData);
                    console.log("Database berhasil dibuat secara otomatis.");
                }

                // 3. Sinkronisasi Real-Time (Setiap perubahan di DB otomatis merubah Website)
                onSnapshot(docRef, (snap) => {
                  if (snap.exists()) {
                    setPortfolioData(snap.data());
                  }
                }, (err) => console.error("Firebase Read Error:", err));

              } catch (error) {
                console.error("Firebase Init Error:", error);
              }
            };
            initFirebase();
          }, []);

          // Fungsi untuk Menyimpan Data ke Firebase
          const handleSaveData = async (newData) => {
            setPortfolioData(newData); // Update UI Langsung
            
            if (db) {
              try {
                const { doc, setDoc } = await import('https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js');
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'main');
                await setDoc(docRef, newData);
              } catch (error) {
                console.error("Gagal menyimpan ke Firebase:", error);
                throw error; // Melempar error agar ditangkap oleh blok catch di AdminDashboard
              }
            }
          };

          return view === 'public' 
            ? <PublicPortfolio data={portfolioData} setView={setView} />
            : <AdminDashboard data={portfolioData} setData={handleSaveData} setView={setView} />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
