<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Portfolio - Industrial Engineer</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; scroll-behavior: smooth; }
        .animate-fade-in-up { animation: fadeInUp 0.8s ease-out forwards; }
        @keyframes fadeInUp {
          from { opacity: 0; transform: translateY(20px); }
          to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-[#F7F8FA]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // ==========================================
        // SEGMENT 1: UTILITIES, ICONS & COMPRESSOR
        // ==========================================
        const IconMapPin = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>;
        const IconMail = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>;
        const IconDownload = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>;
        const IconClose = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>;
        const IconDashboard = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect></svg>;
        const IconEdit = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>;
        const IconBriefcase = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>;
        const IconFileText = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>;
        const IconUpload = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>;

        // Image Compressor Logic (Client-Side)
        const compressImage = (file, callback) => {
            if (!file) return;
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    let width = img.width;
                    let height = img.height;
                    
                    if (width > MAX_WIDTH) {
                        height = Math.round((height *= MAX_WIDTH / width));
                        width = MAX_WIDTH;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', 0.8)); // Convert to Base64 (Compressed JPG)
                };
            };
        };

        // ==========================================
        // SEGMENT 2: DATA STRUCTURE & MOCK
        // ==========================================
        const initialData = {
          hero: {
            name: "Alexander Ryandi",
            headline: "Industrial & Manufacturing Engineer",
            description: "Specializing in lean manufacturing, production optimization, and continuous improvement.",
            location: "Jakarta, Indonesia",
            email: "alexander.eng@example.com",
            photoUrl: "https://placehold.co/600x800/101C2C/FFFFFF?text=AR",
            photoSettings: { zoom: 100, posX: 50, posY: 50 }
          },
          about: {
            summary: "A results-driven Industrial Engineer with a proven track record of increasing production efficiency by 35%.",
            education: "B.Sc. in Industrial Engineering - ITB",
            focus: "Production Planning, QC, Process Automation"
          },
          masterSkills: ["Lean Six Sigma", "AutoCAD", "Minitab", "Power Query", "Data Analytics"],
          experience: [
            {
              id: 1,
              company: "Astra International",
              logo: "",
              role: "Senior Process Engineer",
              period: "2020 - Present",
              location: "Jakarta",
              department: "Manufacturing",
              description: "Leading process optimization for automotive parts.",
              achievements: ["Reduced cycle time by 15%"]
            }
          ],
          projects: [
            {
              id: 1,
              title: "Lean Assembly Transformation",
              category: "Continuous Improvement",
              summary: "Redesign of the main assembly line.",
              cover: "https://placehold.co/800x500/172B45/FFFFFF?text=Lean+Assembly",
              experienceId: 1,
              detail: {
                background: "Existing line had 20% idle time.",
                objectives: "Balance line and improve ergonomics.",
                scope: "Main Assembly Line A",
                roles: "Project Lead",
                methodology: "Value Stream Mapping, 5S",
                results: "Output +400 units/day.",
                skills: ["Lean Six Sigma", "AutoCAD"]
              }
            }
          ]
        };

        // ==========================================
        // SEGMENT 3: ADMIN SUB-COMPONENTS
        // ==========================================
        const ExperienceEditor = ({ exp, onSave, onCancel }) => {
            const [local, setLocal] = useState(exp || { id: Date.now(), company: '', logo: '', role: '', period: '', location: '', department: '', description: '', achievements: [] });
            
            const handleImg = (e) => {
                const file = e.target.files[0];
                if (file) compressImage(file, (base64) => setLocal({...local, logo: base64}));
            };

            return (
                <div className="space-y-6">
                    <h3 className="text-lg font-bold text-gray-800 border-b pb-2">{exp ? 'Edit Experience' : 'Add New Experience'}</h3>
                    
                    <div className="flex items-center gap-4 p-4 border rounded bg-gray-50">
                        <label className="flex flex-col items-center justify-center w-24 h-24 border-2 border-dashed border-gray-300 rounded cursor-pointer bg-white hover:bg-gray-50 overflow-hidden">
                            {local.logo ? (
                                <img src={local.logo} className="w-full h-full object-contain p-1" alt="Logo" />
                            ) : (
                                <div className="text-center text-gray-400"><IconUpload /><span className="text-[10px] block mt-1">Logo PT</span></div>
                            )}
                            <input type="file" className="hidden" accept="image/png, image/jpeg" onChange={handleImg} />
                        </label>
                        <div className="flex-1 space-y-2">
                            <input type="text" placeholder="Atau paste link URL logo..." value={local.logo} onChange={e => setLocal({...local, logo: e.target.value})} className="w-full border p-2 rounded text-xs" />
                            <p className="text-xs text-gray-500">Upload logo format JPG/PNG, otomatis dikompres.</p>
                        </div>
                    </div>

                    <div className="grid grid-cols-2 gap-4">
                        <input type="text" placeholder="Company Name" value={local.company} onChange={e => setLocal({...local, company: e.target.value})} className="border p-2 rounded" />
                        <input type="text" placeholder="Job Title / Role" value={local.role} onChange={e => setLocal({...local, role: e.target.value})} className="border p-2 rounded" />
                        <input type="text" placeholder="Period (e.g. 2020 - Present)" value={local.period} onChange={e => setLocal({...local, period: e.target.value})} className="border p-2 rounded" />
                        <input type="text" placeholder="Location" value={local.location} onChange={e => setLocal({...local, location: e.target.value})} className="border p-2 rounded" />
                    </div>
                    <textarea placeholder="Job Overview" rows="3" value={local.description} onChange={e => setLocal({...local, description: e.target.value})} className="border p-2 rounded w-full"></textarea>
                    <div className="flex justify-end gap-3 pt-4 border-t">
                        <button onClick={onCancel} className="px-4 py-2 border rounded">Cancel</button>
                        <button onClick={() => onSave(local)} className="px-4 py-2 bg-blue-600 text-white rounded">Save Experience</button>
                    </div>
                </div>
            );
        };

        const ProjectEditor = ({ project, onSave, onCancel }) => {
            const [local, setLocal] = useState(project || { 
                id: Date.now(), title: '', category: '', summary: '', cover: '', 
                detail: { background: '', objectives: '', scope: '', roles: '', methodology: '', results: '', skills: [] }
            });
            const [tab, setTab] = useState('info'); // info, detail, image

            const handleImg = (e) => {
                const file = e.target.files[0];
                if (file) compressImage(file, (base64) => setLocal({...local, cover: base64}));
            };

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center border-b pb-4">
                        <h3 className="text-lg font-bold text-gray-800">{project ? 'Edit Project' : 'Add Project'}</h3>
                        <div className="flex bg-gray-100 p-1 rounded">
                            {['info', 'detail', 'image'].map(t => (
                                <button key={t} onClick={() => setTab(t)} className={`px-4 py-1 text-sm rounded capitalize ${tab === t ? 'bg-white shadow font-bold' : 'text-gray-500'}`}>{t}</button>
                            ))}
                        </div>
                    </div>

                    {tab === 'info' && (
                        <div className="space-y-4">
                            <input type="text" placeholder="Project Title" value={local.title} onChange={e => setLocal({...local, title: e.target.value})} className="w-full border p-2 rounded" />
                            <input type="text" placeholder="Category (e.g. Data Analytics)" value={local.category} onChange={e => setLocal({...local, category: e.target.value})} className="w-full border p-2 rounded" />
                            <textarea placeholder="Short Summary" rows="3" value={local.summary} onChange={e => setLocal({...local, summary: e.target.value})} className="w-full border p-2 rounded"></textarea>
                        </div>
                    )}

                    {tab === 'detail' && (
                        <div className="grid grid-cols-2 gap-4">
                            <div className="space-y-2"><label className="text-xs font-bold text-gray-500">Background</label><textarea value={local.detail.background} onChange={e => setLocal({...local, detail: {...local.detail, background: e.target.value}})} className="w-full border p-2 rounded" rows="2"></textarea></div>
                            <div className="space-y-2"><label className="text-xs font-bold text-gray-500">Objectives</label><textarea value={local.detail.objectives} onChange={e => setLocal({...local, detail: {...local.detail, objectives: e.target.value}})} className="w-full border p-2 rounded" rows="2"></textarea></div>
                            <div className="space-y-2"><label className="text-xs font-bold text-gray-500">Scope</label><textarea value={local.detail.scope} onChange={e => setLocal({...local, detail: {...local.detail, scope: e.target.value}})} className="w-full border p-2 rounded" rows="2"></textarea></div>
                            <div className="space-y-2"><label className="text-xs font-bold text-gray-500">Methodology</label><textarea value={local.detail.methodology} onChange={e => setLocal({...local, detail: {...local.detail, methodology: e.target.value}})} className="w-full border p-2 rounded" rows="2"></textarea></div>
                            <div className="col-span-2 space-y-2"><label className="text-xs font-bold text-gray-500">Key Results</label><textarea value={local.detail.results} onChange={e => setLocal({...local, detail: {...local.detail, results: e.target.value}})} className="w-full border p-2 rounded" rows="2"></textarea></div>
                        </div>
                    )}

                    {tab === 'image' && (
                        <div className="space-y-4">
                            <label className="flex flex-col items-center justify-center w-full h-40 border-2 border-dashed border-gray-300 rounded cursor-pointer bg-gray-50 hover:bg-gray-100">
                                <div className="flex flex-col items-center justify-center pt-5 pb-6 text-gray-500">
                                    <IconUpload />
                                    <p className="mt-2 text-sm font-semibold">Upload JPG/PNG</p>
                                    <p className="text-xs">Otomatis di-kompres (Max 800px)</p>
                                </div>
                                <input type="file" className="hidden" accept="image/png, image/jpeg" onChange={handleImg} />
                            </label>
                            {local.cover && <img src={local.cover} alt="Preview" className="h-32 object-cover rounded border" />}
                            <input type="text" placeholder="Atau paste link URL gambar..." value={local.cover} onChange={e => setLocal({...local, cover: e.target.value})} className="w-full border p-2 rounded text-xs" />
                        </div>
                    )}

                    <div className="flex justify-end gap-3 pt-4 border-t">
                        <button onClick={onCancel} className="px-4 py-2 border rounded">Cancel</button>
                        <button onClick={() => onSave(local)} className="px-4 py-2 bg-blue-600 text-white rounded">Save Project</button>
                    </div>
                </div>
            );
        };

        // ==========================================
        // SEGMENT 4: ADMIN DASHBOARD (MAIN)
        // ==========================================
        const AdminDashboard = ({ data, setData, setView }) => {
          const [activeTab, setActiveTab] = useState('Hero');
          const [formData, setFormData] = useState(data);
          const [notification, setNotification] = useState('');
          const [editingItem, setEditingItem] = useState(null); // { type: 'exp'|'proj', id: number|'new' }

          const handleNestedChange = (section, field, value) => {
            setFormData({ ...formData, [section]: { ...formData[section], [field]: value } });
          };

          const handleSave = async () => {
            try {
                await setData(formData);
                setNotification('✅ Berhasil! Perubahan tersimpan permanen di Firebase.');
            } catch(e) {
                setNotification('❌ Error: ' + (e.message || 'Gagal menyimpan.'));
                console.error(e);
            }
            setTimeout(() => setNotification(''), 5000);
          };

          return (
            <div className="flex h-screen bg-[#F4F6F9] font-sans text-sm relative">
              {notification && (
                <div className="absolute top-4 left-1/2 transform -translate-x-1/2 z-50 bg-[#101C2C] text-white px-6 py-3 rounded shadow-lg animate-fade-in-up font-medium">
                  {notification}
                </div>
              )}

              <div className="w-64 bg-white border-r border-gray-200 flex flex-col shadow-sm z-10">
                <div className="h-16 flex items-center px-6 border-b border-gray-200">
                  <div className="font-bold text-lg text-[#EE4D2D]">Workspace<span className="text-[#101C2C]">Admin</span></div>
                </div>
                <div className="flex-1 overflow-y-auto py-4">
                  <div className="px-6 mb-2 text-xs font-bold text-gray-400 uppercase tracking-wider">Content Management</div>
                  <nav className="space-y-1">
                    {[
                      { id: 'Hero', icon: <IconDashboard />, label: 'Hero Section' },
                      { id: 'About', icon: <IconFileText />, label: 'About & Info' },
                      { id: 'Experience', icon: <IconBriefcase />, label: 'Experiences' },
                      { id: 'Projects', icon: <IconEdit />, label: 'Manage Projects' },
                    ].map((item) => (
                      <button key={item.id} onClick={() => { setActiveTab(item.id); setEditingItem(null); }}
                        className={`w-full flex items-center px-6 py-3 transition-colors ${activeTab === item.id ? 'bg-[#EE4D2D]/10 text-[#EE4D2D] border-r-4 border-[#EE4D2D]' : 'text-gray-600 hover:bg-gray-50'}`}>
                        <span className="mr-3">{item.icon}</span>{item.label}
                      </button>
                    ))}
                  </nav>
                </div>
                <div className="p-4 border-t border-gray-200">
                  <button onClick={() => setView('public')} className="w-full py-2 text-center text-[#64748B] bg-gray-100 hover:bg-gray-200 rounded font-medium transition-colors">Exit to Website</button>
                </div>
              </div>

              <div className="flex-1 flex flex-col overflow-hidden">
                <header className="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-8 shadow-sm z-0">
                  <h1 className="text-xl font-bold text-gray-800">Editor Panel</h1>
                  <div className="flex space-x-4">
                    <button onClick={() => setFormData(data)} className="px-4 py-2 border border-gray-300 text-gray-700 rounded hover:bg-gray-50 font-medium">Discard Changes</button>
                    <button onClick={handleSave} className="px-6 py-2 bg-[#EE4D2D] text-white rounded hover:bg-[#D74325] font-medium shadow-md shadow-[#EE4D2D]/20 transition-all">Save & Publish</button>
                  </div>
                </header>

                <main className="flex-1 overflow-y-auto p-8">
                  <div className="bg-white rounded border border-gray-200 shadow-sm max-w-4xl">
                    {activeTab === 'Hero' && (
                      <div className="p-8 space-y-6">
                        <div className="grid grid-cols-2 gap-6">
                          <div className="space-y-2"><label className="block font-medium text-gray-700">Nama Lengkap</label><input type="text" value={formData.hero.name} onChange={(e) => handleNestedChange('hero', 'name', e.target.value)} className="w-full px-4 py-2 border rounded outline-none focus:border-[#EE4D2D]" /></div>
                          <div className="space-y-2"><label className="block font-medium text-gray-700">Headline</label><input type="text" value={formData.hero.headline} onChange={(e) => handleNestedChange('hero', 'headline', e.target.value)} className="w-full px-4 py-2 border rounded outline-none focus:border-[#EE4D2D]" /></div>
                        </div>
                        <div className="space-y-2"><label className="block font-medium text-gray-700">Deskripsi Singkat</label><textarea rows="3" value={formData.hero.description} onChange={(e) => handleNestedChange('hero', 'description', e.target.value)} className="w-full px-4 py-2 border rounded outline-none focus:border-[#EE4D2D]"></textarea></div>
                        <div className="grid grid-cols-2 gap-6">
                          <div className="space-y-2"><label className="block font-medium text-gray-700">Location</label><input type="text" value={formData.hero.location} onChange={(e) => handleNestedChange('hero', 'location', e.target.value)} className="w-full px-4 py-2 border rounded outline-none" /></div>
                          <div className="space-y-2"><label className="block font-medium text-gray-700">Email</label><input type="text" value={formData.hero.email} onChange={(e) => handleNestedChange('hero', 'email', e.target.value)} className="w-full px-4 py-2 border rounded outline-none" /></div>
                        </div>

                        {/* FITUR BARU: PENGATURAN FOTO HERO */}
                        <div className="mt-8 pt-6 border-t border-gray-200">
                          <h3 className="font-bold text-gray-800 mb-4">Pengaturan Foto Utama (Hero Image)</h3>
                          <div className="grid md:grid-cols-2 gap-8">
                            <div className="space-y-4">
                              <label className="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed border-gray-300 rounded cursor-pointer bg-gray-50 hover:bg-gray-100">
                                <div className="flex flex-col items-center justify-center pt-5 pb-6 text-gray-500">
                                  <IconUpload />
                                  <p className="mt-2 text-sm font-semibold">Upload Foto Baru (JPG/PNG)</p>
                                  <p className="text-xs">Otomatis dikompres</p>
                                </div>
                                <input type="file" className="hidden" accept="image/png, image/jpeg" onChange={(e) => {
                                  const file = e.target.files[0];
                                  if (file) compressImage(file, (base64) => handleNestedChange('hero', 'photoUrl', base64));
                                }} />
                              </label>
                              
                              <div className="space-y-1">
                                <label className="block text-xs font-bold text-gray-500">Direct Link Foto (URL)</label>
                                <input type="text" value={formData.hero.photoUrl} onChange={(e) => handleNestedChange('hero', 'photoUrl', e.target.value)} className="w-full px-3 py-2 border rounded outline-none text-xs" />
                              </div>

                              <div className="space-y-4 pt-4 border-t border-gray-100">
                                <div>
                                  <label className="text-xs font-bold text-gray-500 flex justify-between">Zoom <span>{formData.hero.photoSettings?.zoom || 100}%</span></label>
                                  <input type="range" min="100" max="250" value={formData.hero.photoSettings?.zoom || 100} onChange={e => setFormData({...formData, hero: {...formData.hero, photoSettings: {...(formData.hero.photoSettings || {zoom:100, posX:50, posY:50}), zoom: e.target.value}}})} className="w-full" />
                                </div>
                                <div>
                                  <label className="text-xs font-bold text-gray-500 flex justify-between">Geser Kiri/Kanan (Posisi X) <span>{formData.hero.photoSettings?.posX || 50}%</span></label>
                                  <input type="range" min="0" max="100" value={formData.hero.photoSettings?.posX || 50} onChange={e => setFormData({...formData, hero: {...formData.hero, photoSettings: {...(formData.hero.photoSettings || {zoom:100, posX:50, posY:50}), posX: e.target.value}}})} className="w-full" />
                                </div>
                                <div>
                                  <label className="text-xs font-bold text-gray-500 flex justify-between">Geser Atas/Bawah (Posisi Y) <span>{formData.hero.photoSettings?.posY || 50}%</span></label>
                                  <input type="range" min="0" max="100" value={formData.hero.photoSettings?.posY || 50} onChange={e => setFormData({...formData, hero: {...formData.hero, photoSettings: {...(formData.hero.photoSettings || {zoom:100, posX:50, posY:50}), posY: e.target.value}}})} className="w-full" />
                                </div>
                              </div>
                            </div>
                            
                            {/* Live Preview Kotak Foto */}
                            <div className="flex justify-center items-center bg-gray-100 rounded border p-4">
                                <div className="w-48 h-[256px] overflow-hidden rounded shadow-lg bg-white relative">
                                    <img 
                                      src={formData.hero.photoUrl} 
                                      alt="Preview" 
                                      className="w-full h-full object-cover" 
                                      style={{ 
                                        objectPosition: `${formData.hero.photoSettings?.posX || 50}% ${formData.hero.photoSettings?.posY || 50}%`, 
                                        transform: `scale(${(formData.hero.photoSettings?.zoom || 100) / 100})` 
                                      }} 
                                    />
                                </div>
                            </div>
                          </div>
                        </div>

                      </div>
                    )}

                    {activeTab === 'About' && (
                      <div className="p-8 space-y-6">
                        <div className="space-y-2">

        const App = () => {
          const [view, setView] = useState('public');
          const [portfolioData, setPortfolioData] = useState(initialData);
          const [db, setDb] = useState(null);
          const [fbApi, setFbApi] = useState(null);

            const initFirebase = async () => {
              try {
                const { initializeApp } = await import('https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js');
                const { getFirestore, doc, onSnapshot, setDoc, getDoc } = await import('https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js');
                
                setFbApi({ doc, setDoc });
                
                // Konfigurasi Asli Firebase
                const firebaseConfig = {
                  apiKey: "AIzaSyB0gq5a09YMfxIHCDJUa833CuS6JM4-r0M",
                  authDomain: "portooooo-8ffd1.firebaseapp.com",
                  projectId: "portooooo-8ffd1",
                  storageBucket: "portooooo-8ffd1.firebasestorage.app",
                  messagingSenderId: "806835327046",
                  appId: "1:806835327046:web:3e2a28f0a806291200ba47",
                  measurementId: "G-4NHWXXMKMH"
                };

                const firestoreDb = getFirestore(initializeApp(firebaseConfig));
                setDb(firestoreDb);
                const docRef = doc(firestoreDb, 'portfolio', 'main_data');
                
                const docSnap = await getDoc(docRef);
                if (!docSnap.exists()) await setDoc(docRef, initialData);

                onSnapshot(docRef, (snap) => {
                  if (snap.exists()) setPortfolioData(snap.data());
                });
              } catch (e) { console.error(e); }
            };
            initFirebase();
          }, []);

          const handleSaveData = async (newData) => {
            setPortfolioData(newData);
            if (db && fbApi) await fbApi.setDoc(fbApi.doc(db, 'portfolio', 'main_data'), newData);
          };

          return view === 'public' 
            ? <PublicPortfolio data={portfolioData} setView={setView} />
            : <AdminDashboard data={portfolioData} setData={handleSaveData} setView={setView} />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
