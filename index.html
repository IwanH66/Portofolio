</head>
<body class="bg-brand-bg text-brand-navy antialiased relative selection:bg-brand-orange selection:text-white">
    <!-- Subtle Technical Background Texture -->
    <div class="fixed inset-0 pointer-events-none z-0 bg-dot-pattern opacity-60"></div>
    
    <div id="root" class="relative z-10"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // ==========================================
        // SEGMENT 1: UTILITIES & COMPRESSOR
        // ==========================================
        const compressImage = (file, callback) => {
            if (!file) return;
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    let width = img.width;
                    let height = img.height;
                    
                    if (width > MAX_WIDTH) {
                        height = Math.round((height *= MAX_WIDTH / width));
                        width = MAX_WIDTH;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    // MENGGUNAKAN WEBP & QUALITY 0.5: Agar file sangat ringan (< 50KB) dan tidak menabrak batas 1MB Firebase
                    callback(canvas.toDataURL('image/webp', 0.5));
                };
            };
        };

        // ==========================================
        // SEGMENT 2: DATA STRUCTURE (UPDATED FOR NEW UI)
        // ==========================================
        const initialData = {
          hero: {
            name: "Kurniawan H.",
            role: "INDUSTRIAL ENGINEER",
            subRole: "& SYSTEM DEVELOPER",
            title1: "ENGINEERING",
            title2: "PORTFOLIO",
            greeting: "Halo! Saya Kurniawan H.",
            description: "Engineer Teknik Industri yang mengombinasikan optimasi sistem manufaktur lapangan dengan pengembangan perangkat lunak berbasis web. Berpengalaman dalam kalkulasi MRP Explosion, WIP Tracking, dan analitik OEE Real-time.",
            email: "kurniawan.engineering@example.com",
            phone: "+62 812-3456-7890",
            location: "Gresik / Surabaya, Jawa Timur",
            photoUrl: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?fit=crop&w=800&q=80",
            photoSettings: { zoom: 100, posX: 50, posY: 50 },
            stats: [
              { id: 1, val: "3+", label: "INTERNSHIPS" },
              { id: 2, val: "4+", label: "SYSTEMS BUILT" },
              { id: 3, val: "1", label: "LSS GREEN BELT" },
              { id: 4, val: "3.58", label: "IPK (UTM)" }
            ]
          },
          educations: [
            { id: 1, name: "Universitas Trunojoyo Madura", role: "S1 Teknik Industri (S.T.)", period: "Kelulusan: Juni 2026", info: "3.58", logo: "", focus: "Fokus studi pada Perencanaan & Pengendalian Production (PPC), Analisis Sistem Manufaktur, Ergonomi & Perancangan Sistem Kerja." }
          ],
          certifications: [
            { id: 1, name: "Lean Six Sigma Green Belt (LSSGB)", type: "CERTIFIED", icon: "fa-award", desc: "Kompetensi dalam metrik DMAIC, pemetaan aliran nilai (Value Stream Mapping), pengendalian kualitas statistik (SPC), dan reduksi variansi proses." },
            { id: 2, name: "Supply Chain & Quality Control Essentials", type: "CREDENTIAL", icon: "fa-certificate", desc: "Sertifikasi pelatihan manajerial stok, ledakan komponen BOM, dan audit pengendalian mutu proses manufaktur." },
            { id: 3, name: "Google Apps Script & Web Automation", type: "CREDENTIAL", icon: "fa-code-commit", desc: "Otomatisasi alur kerja spreadsheet dan pembuatan backend database berbasis cloud untuk pelaporan bisnis." }
          ],
          experience: [
            {
              id: 1,
              company: "PT Industri Kemasan Semen Gresik (IKSG)",
              role: "Production Staff Intern",
              period: "Agustus 2026",
              icon: "fa-calendar-check",
              color: "text-brand-orange",
              description: "• Menganalisis alur produksi pembuatan kantong semen kertas bertingkat.\n• Membantu pembuatan logika kalkulasi ledakan material (MRP Explosion).\n• Menyusun pencatatan stok Work-In-Progress (WIP)."
            },
            {
              id: 2,
              company: "PT Indospring Tbk",
              role: "Maintenance & Production Improvement Intern",
              period: "2025 - 2026",
              icon: "fa-calendar-check",
              color: "text-brand-navy",
              description: "• Mendukung program TPM pada lini perakitan dan penempaan pegas.\n• Mencatat log downtime mesin serta merumuskan indikator OEE.\n• Melakukan identifikasi pemborosan (waste identification)."
            }
          ],
          projects: [
            {
              id: 1,
              title: "MRP Explosion & WIP Tracker System",
              category: "PRODUCTION PLANNING & CONTROL",
              client: "PT SEMEN GRESIK (IKSG)",
              summary: "Aplikasi kalkulasi ledakan material bertingkat untuk pabrik kantong semen. Mengendalikan stok WIP di departemen produksi.",
              tools: "JavaScript / PHP / MySQL",
              icon: "fa-boxes-stacked",
              colorTheme: "bg-brand-navy text-white", // navy, slate, orange
              detail: {
                background: "Proses manufaktur membutuhkan perhitungan presisi terkait kebutuhan bahan baku bertingkat di departemen Loom, Laminating, dan Printing.",
                scope: "1. Algoritma ledakan BOM multi-level\n2. Pencatatan akurat penumpukan WIP",
                results: "Menggantikan spreadsheet manual dengan dashboard berbasis web yang mempercepat perhitungan alokasi material hingga >60%."
              }
            },
            {
              id: 2,
              title: "Resume & Candidate Management Web App",
              category: "HRTECH & RECRUITMENT",
              client: "WEB APP & FIREBASE",
              summary: "Aplikasi web terkoneksi Firebase untuk mengindeks kompetensi pelamar, mengelola profil kandidat, dan otomatisasi.",
              tools: "Firebase / JS ES6 / Tailwind",
              icon: "fa-id-card-clip",
              colorTheme: "bg-slate-900 text-white",
              detail: {
                background: "HR membutuhkan sistem terpusat untuk memilah dan menilai kandidat secara otomatis berdasarkan kualifikasi spesifik.",
                scope: "1. Integrasi Auth & Database Cloud Firebase\n2. Pembobotan otomatis kualifikasi",
                results: "Meningkatkan kecepatan screening kandidat dan menyediakan database talenta yang mudah dicari."
              }
            }
          ],
          skills: {
            industrial: ['MRP & BOM', 'WIP Tracking', 'Line Balancing', 'Time & Motion Study'],
            web: ['JavaScript (ES6)', 'HTML & CSS', 'Tailwind', 'Google Apps Script'],
            database: ['Firebase Realtime DB', 'Firestore', 'MySQL', 'REST API'],
            quality: ['Lean Six Sigma', 'OEE / TPM', 'SPC & Minitab', '5S & Kaizen']
          },
          skillsInfo: {
            tag: "COMPETENCIES",
            title: "SKILLS & EXPERTISE",
            description: "Kombinasi keahlian teknik industri, metodologi kualitas, dan kemampuan pemrograman web."
          }
        };

        // ==========================================
        // SEGMENT 3: ADMIN COMPONENTS
        // ==========================================
        const ProjectEditor = ({ project, onSave, onCancel }) => {
            const [local, setLocal] = useState(project || { id: Date.now(), title: '', category: '', client: '', summary: '', tools: '', icon: 'fa-box', colorTheme: 'bg-brand-navy text-white', detail: { background: '', scope: '', results: '' }, coverImage: '' });
            
            return (
                <div className="space-y-4">
                    <h3 className="text-lg font-bold border-b pb-2">{project ? 'Edit Project' : 'Add Project'}</h3>
                    <div className="grid grid-cols-2 gap-4">
                        <input type="text" placeholder="Project Title" value={local.title} onChange={e => setLocal({...local, title: e.target.value})} className="border p-2 rounded w-full" />
                        <input type="text" placeholder="Category (e.g. PRODUCTION PLANNING)" value={local.category} onChange={e => setLocal({...local, category: e.target.value})} className="border p-2 rounded w-full" />
                        <input type="text" placeholder="Client / Subtitle" value={local.client} onChange={e => setLocal({...local, client: e.target.value})} className="border p-2 rounded w-full" />
                        <input type="text" placeholder="Tools (e.g. JS / Firebase)" value={local.tools} onChange={e => setLocal({...local, tools: e.target.value})} className="border p-2 rounded w-full" />
                        <div className="col-span-2">
                            <label className="block text-xs font-bold text-slate-500 mb-1">Cover Image / Gambar Proyek (JPG/PNG)</label>
                            <input type="file" accept="image/png, image/jpeg" onChange={e => {
                                const file = e.target.files[0];
                                if (file) compressImage(file, (base64) => setLocal({...local, coverImage: base64}));
                            }} className="border p-2 rounded w-full text-xs" />
                            {local.coverImage && <img src={local.coverImage} alt="Cover Preview" className="h-20 mt-2 rounded object-cover border" />}
                        </div>
                    </div>
                    <textarea placeholder="Short Summary" rows="2" value={local.summary} onChange={e => setLocal({...local, summary: e.target.value})} className="border p-2 rounded w-full"></textarea>
                    
                    <div className="p-4 bg-slate-50 border rounded space-y-3">
                        <p className="text-xs font-bold text-slate-500">POP-UP DETAILS (Background, Scope, Results)</p>
                        <textarea placeholder="Background / Masalah" rows="2" value={local.detail.background} onChange={e => setLocal({...local, detail: {...local.detail, background: e.target.value}})} className="border p-2 rounded w-full text-xs"></textarea>
                        <textarea placeholder="Scope / Poin-poin penting (Gunakan Enter)" rows="2" value={local.detail.scope} onChange={e => setLocal({...local, detail: {...local.detail, scope: e.target.value}})} className="border p-2 rounded w-full text-xs"></textarea>
                        <textarea placeholder="Results / Hasil" rows="2" value={local.detail.results} onChange={e => setLocal({...local, detail: {...local.detail, results: e.target.value}})} className="border p-2 rounded w-full text-xs"></textarea>
                    </div>

                    <div className="flex justify-end gap-3 pt-4 border-t">
                        <button onClick={onCancel} className="px-4 py-2 border rounded text-slate-600">Batal</button>
                        <button onClick={() => onSave(local)} className="px-4 py-2 bg-brand-orange text-white rounded">Simpan Proyek</button>
                    </div>
                </div>
            );
        };

        const ExperienceEditor = ({ exp, onSave, onCancel }) => {
            const [local, setLocal] = useState(exp || { id: Date.now(), company: '', role: '', period: '', description: '', color: 'text-brand-orange', companyLogo: '', documentationImage: '' });
            return (
                <div className="space-y-4">
                    <h3 className="text-lg font-bold border-b pb-2">{exp ? 'Edit Experience' : 'Add Experience'}</h3>
                    <div className="grid grid-cols-2 gap-4">
                        <input type="text" placeholder="Posisi / Role" value={local.role} onChange={e => setLocal({...local, role: e.target.value})} className="border p-2 rounded w-full" />
                        <input type="text" placeholder="Nama Perusahaan" value={local.company} onChange={e => setLocal({...local, company: e.target.value})} className="border p-2 rounded w-full" />
                        <input type="text" placeholder="Periode (e.g. 2025 - 2026)" value={local.period} onChange={e => setLocal({...local, period: e.target.value})} className="border p-2 rounded w-full" />
                        <div className="col-span-2">
                            <label className="block text-xs font-bold text-slate-500 mb-1">Logo Perusahaan (JPG/PNG)</label>
                            <input type="file" accept="image/png, image/jpeg" onChange={e => {
                                const file = e.target.files[0];
                                if (file) compressImage(file, (base64) => setLocal({...local, companyLogo: base64}));
                            }} className="border p-2 rounded w-full text-xs" />
                            {local.companyLogo && <img src={local.companyLogo} alt="Logo Preview" className="h-12 mt-2 rounded object-contain border p-1 bg-white" />}
                        </div>
                    </div>
                    <textarea placeholder="Deskripsi Tugas (Gunakan bullet points atau enter)" rows="4" value={local.description} onChange={e => setLocal({...local, description: e.target.value})} className="border p-2 rounded w-full text-sm"></textarea>
                    
                    <div className="pt-2">
                        <label className="block text-xs font-bold text-slate-500 mb-1">Foto Dokumentasi Kegiatan (Opsional)</label>
                        <input type="file" accept="image/png, image/jpeg" onChange={e => {
                            const file = e.target.files[0];
                            if (file) compressImage(file, (base64) => setLocal({...local, documentationImage: base64}));
                        }} className="border p-2 rounded w-full text-xs" />
                        {local.documentationImage && <img src={local.documentationImage} alt="Doc Preview" className="h-32 mt-2 rounded-lg object-cover border shadow-sm" />}
                    </div>

                    <div className="flex justify-end gap-3 pt-4 border-t">
                        <button onClick={onCancel} className="px-4 py-2 border rounded text-slate-600">Batal</button>
                        <button onClick={() => onSave(local)} className="px-4 py-2 bg-brand-orange text-white rounded">Simpan</button>
                    </div>
                </div>
            );
        };

        // ==========================================
        // SEGMENT 4: ADMIN DASHBOARD
        // ==========================================
        const AdminDashboard = ({ data, setData, setView }) => {
          const [activeTab, setActiveTab] = useState('Hero');
          const [formData, setFormData] = useState(data);
          const [notification, setNotification] = useState(null);
          const [editingItem, setEditingItem] = useState(null); 

          const handleNestedChange = (section, field, value) => {
            setFormData({ ...formData, [section]: { ...formData[section], [field]: value } });
          };

          const handleStatChange = (id, field, value) => {
            const newStats = formData.hero.stats.map(s => s.id === id ? { ...s, [field]: value } : s);
            handleNestedChange('hero', 'stats', newStats);
          };

          const handleSave = async () => {
            try {
                await setData(formData);
                setNotification({ type: 'success', text: 'Berhasil disimpan ke Database!' });
            } catch(e) {
                setNotification({ type: 'error', text: 'Gagal: ' + e.message });
            }
            setTimeout(() => setNotification(null), 3000);
          };

          return (
            <div className="flex h-screen bg-slate-50 font-sans text-sm relative">
              {notification && (
                <div className={`absolute top-4 left-1/2 transform -translate-x-1/2 z-50 px-6 py-3 rounded shadow-lg font-bold animate-fade-in-up ${notification.type === 'success' ? 'bg-emerald-600 text-white' : 'bg-red-600 text-white'}`}>
                  {notification.text}
                </div>
              )}

              {/* Sidebar */}
              <div className="w-64 bg-white border-r border-slate-200 flex flex-col shadow-sm z-10">
                <div className="h-16 flex items-center justify-center border-b border-slate-200">
                  <div className="font-display font-black text-xl text-brand-navy">ADMIN<span className="text-brand-orange">PANEL</span></div>
                </div>
                <div className="flex-1 overflow-y-auto py-6 space-y-1">
                  {['Hero', 'Experience', 'Projects', 'Skills', 'Contact'].map((tab) => (
                    <button key={tab} onClick={() => { setActiveTab(tab); setEditingItem(null); }}
                      className={`w-full flex items-center px-6 py-3 font-bold transition-colors ${activeTab === tab ? 'bg-brand-orange/10 text-brand-orange border-r-4 border-brand-orange' : 'text-slate-500 hover:bg-slate-50'}`}>
                      <i className={`fa-solid fa-${tab === 'Hero' ? 'user' : tab === 'Experience' ? 'briefcase' : tab === 'Projects' ? 'boxes-stacked' : tab === 'Skills' ? 'star' : 'envelope'} w-6`}></i> {tab} Section
                    </button>
                  ))}
                </div>
                <div className="p-4 border-t border-slate-200">
                  <button onClick={() => setView('public')} className="w-full py-2.5 text-center text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg font-bold font-mono text-xs transition-colors">EXIT TO WEBSITE</button>
                </div>
              </div>

              {/* Main Content */}
              <div className="flex-1 flex flex-col overflow-hidden">
                <header className="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 shadow-sm">
                  <h1 className="text-lg font-bold text-brand-navy font-display uppercase">{activeTab} Editor</h1>
                  <button onClick={handleSave} className="px-6 py-2 bg-brand-orange text-white rounded-lg hover:bg-brand-orangeDark font-bold font-mono text-xs shadow-md transition-all">SAVE & PUBLISH</button>
                </header>

                <main className="flex-1 overflow-y-auto p-8">
                  <div className="bg-white rounded-2xl border border-slate-200 shadow-sm max-w-4xl p-8">
                    
                    {activeTab === 'Hero' && (
                      <div className="space-y-8">
                        <div className="grid grid-cols-2 gap-6">
                            <div className="space-y-2"><label className="font-bold text-slate-700">Nama (Logo K.)</label><input type="text" value={formData.hero.name} onChange={e => handleNestedChange('hero', 'name', e.target.value)} className="w-full border p-2.5 rounded bg-slate-50" /></div>
                            <div className="space-y-2"><label className="font-bold text-slate-700">Salam Pembuka</label><input type="text" value={formData.hero.greeting} onChange={e => handleNestedChange('hero', 'greeting', e.target.value)} className="w-full border p-2.5 rounded bg-slate-50" /></div>
                            <div className="space-y-2"><label className="font-bold text-slate-700">Role Utama</label><input type="text" value={formData.hero.role} onChange={e => handleNestedChange('hero', 'role', e.target.value)} className="w-full border p-2.5 rounded bg-slate-50" /></div>
                            <div className="space-y-2"><label className="font-bold text-slate-700">Sub Role</label><input type="text" value={formData.hero.subRole} onChange={e => handleNestedChange('hero', 'subRole', e.target.value)} className="w-full border p-2.5 rounded bg-slate-50" /></div>
                        </div>
                        <div className="space-y-2">
                            <label className="font-bold text-slate-700">Deskripsi Paragraf</label>
                            <textarea rows="3" value={formData.hero.description} onChange={e => handleNestedChange('hero', 'description', e.target.value)} className="w-full border p-2.5 rounded bg-slate-50"></textarea>
                        </div>
                        
                        {/* 4 Stats Editor */}
                        <div className="pt-6 border-t">
                            <h3 className="font-bold text-brand-navy font-display mb-4">Edit 4 Pencapaian (Stats)</h3>
                            <div className="grid grid-cols-2 gap-4">
                                {formData.hero.stats.map((stat, idx) => (
                                    <div key={stat.id} className="p-4 bg-slate-50 border rounded-lg flex gap-3">
                                        <div className="w-1/3 space-y-1">
                                            <label className="text-xs font-bold text-slate-500">Angka</label>
                                            <input type="text" value={stat.val} onChange={e => handleStatChange(stat.id, 'val', e.target.value)} className="w-full border p-2 rounded text-brand-orange font-bold text-center" />
                                        </div>
                                        <div className="w-2/3 space-y-1">
                                            <label className="text-xs font-bold text-slate-500">Label Text</label>
                                            <input type="text" value={stat.label} onChange={e => handleStatChange(stat.id, 'label', e.target.value)} className="w-full border p-2 rounded uppercase text-xs" />
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Photo Settings */}
                        <div className="pt-6 border-t grid grid-cols-2 gap-8">
                            <div className="space-y-4">
                                <h3 className="font-bold text-brand-navy font-display">Foto Utama (Hero)</h3>
                                <label className="flex flex-col items-center justify-center w-full h-24 border-2 border-dashed border-slate-300 rounded-lg cursor-pointer bg-slate-50 hover:bg-slate-100">
                                    <div className="text-center text-slate-500"><i className="fa-solid fa-cloud-arrow-up"></i><p className="text-xs font-bold mt-1">Upload JPG/PNG</p></div>
                                    <input type="file" className="hidden" accept="image/png, image/jpeg" onChange={e => {
                                        const file = e.target.files[0];
                                        if (file) compressImage(file, (base64) => handleNestedChange('hero', 'photoUrl', base64));
                                    }} />
                                </label>
                                <div className="space-y-2">
                                    <label className="text-xs font-bold text-slate-500 flex justify-between">Zoom <span>{formData.hero.photoSettings?.zoom || 100}%</span></label>
                                    <input type="range" min="100" max="250" value={formData.hero.photoSettings?.zoom || 100} onChange={e => setFormData({...formData, hero: {...formData.hero, photoSettings: {...(formData.hero.photoSettings || {zoom:100, posX:50, posY:50}), zoom: e.target.value}}})} className="w-full" />
                                </div>
                            </div>
                            <div className="flex justify-center items-center">
                                <div className="w-48 aspect-[4/5] rounded-[2rem] bg-brand-navy border-4 border-slate-200 overflow-hidden relative">
                                    <img src={formData.hero.photoUrl} alt="Preview" className="w-full h-full object-cover" 
                                      style={{ objectPosition: `${formData.hero.photoSettings?.posX || 50}% ${formData.hero.photoSettings?.posY || 50}%`, transform: `scale(${(formData.hero.photoSettings?.zoom || 100) / 100})` }} 
                                    />
                                </div>
                            </div>
                        </div>
                      </div>
                    )}

                    {activeTab === 'Experience' && (
                        <div>
                            {editingItem?.type === 'exp' ? (
                                <ExperienceEditor 
                                    exp={editingItem.id === 'new' ? null : formData.experience.find(e => e.id === editingItem.id)}
                                    onCancel={() => setEditingItem(null)}
                                    onSave={(newExp) => {
                                        const newArray = editingItem.id === 'new' ? [...(formData.experience||[]), newExp] : formData.experience.map(e => e.id === newExp.id ? newExp : e);
                                        setFormData({...formData, experience: newArray});
                                        setEditingItem(null);
                                    }}
                                />
                            ) : (
                                <div className="space-y-4">
                                    <button onClick={() => setEditingItem({type: 'exp', id: 'new'})} className="mb-4 px-4 py-2.5 bg-slate-100 text-brand-navy font-bold rounded-lg font-mono text-xs hover:bg-slate-200 border border-slate-200">+ TAMBAH PENGALAMAN BARU</button>
                                    {(formData.experience || []).map((exp) => (
                                        <div key={exp.id} className="flex justify-between items-center p-3 border rounded-xl bg-slate-50">
                                            <div className="flex items-center gap-3">
                                                {exp.companyLogo ? <img src={exp.companyLogo} className="w-10 h-10 rounded object-contain bg-white border p-1" /> : <div className="w-10 h-10 rounded bg-slate-200 flex items-center justify-center text-slate-400"><i className="fa-solid fa-briefcase"></i></div>}
                                                <div><div className="font-bold text-brand-navy text-sm">{exp.role}</div><div className="text-xs text-slate-500 font-mono mt-0.5">{exp.company}</div></div>
                                            </div>
                                            <div className="space-x-2 flex">
                                                <button onClick={() => setEditingItem({type: 'exp', id: exp.id})} className="px-3 py-1.5 bg-white border rounded shadow-sm text-xs font-bold text-slate-700 hover:text-brand-orange"><i className="fa-solid fa-pen"></i> Edit</button>
                                                <button onClick={() => setFormData({...formData, experience: formData.experience.filter(e => e.id !== exp.id)})} className="px-3 py-1.5 bg-white border rounded shadow-sm text-xs font-bold text-red-500 hover:bg-red-50"><i className="fa-solid fa-trash"></i></button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    )}

                    {activeTab === 'Projects' && (
                        <div>
                            {editingItem?.type === 'proj' ? (
                                <ProjectEditor 
                                    project={editingItem.id === 'new' ? null : formData.projects.find(p => p.id === editingItem.id)}
                                    onCancel={() => setEditingItem(null)}
                                    onSave={(newProj) => {
                                        const newArray = editingItem.id === 'new' ? [...(formData.projects||[]), newProj] : formData.projects.map(p => p.id === newProj.id ? newProj : p);
                                        setFormData({...formData, projects: newArray});
                                        setEditingItem(null);
                                    }}
                                />
                            ) : (
                                <div className="space-y-4">
                                    <button onClick={() => setEditingItem({type: 'proj', id: 'new'})} className="mb-4 px-4 py-2.5 bg-slate-100 text-brand-navy font-bold rounded-lg font-mono text-xs hover:bg-slate-200 border border-slate-200">+ TAMBAH PROYEK BARU</button>
                                    {(formData.projects || []).map((proj) => (
                                        <div key={proj.id} className="flex justify-between items-center p-4 border rounded-xl bg-slate-50">
                                            <div className="flex items-center gap-3">
                                                {proj.coverImage && <img src={proj.coverImage} className="w-10 h-10 rounded object-cover border" />}
                                                <div><div className="font-bold text-brand-navy">{proj.title}</div><div className="text-xs text-slate-500 font-mono mt-1">{proj.category}</div></div>
                                            </div>
                                            <div className="space-x-2 flex">
                                                <button onClick={() => setEditingItem({type: 'proj', id: proj.id})} className="px-3 py-1.5 bg-white border rounded shadow-sm text-xs font-bold text-slate-700 hover:text-brand-orange"><i className="fa-solid fa-pen"></i> Edit</button>
                                                <button onClick={() => setFormData({...formData, projects: formData.projects.filter(p => p.id !== proj.id)})} className="px-3 py-1.5 bg-white border rounded shadow-sm text-xs font-bold text-red-500 hover:bg-red-50"><i className="fa-solid fa-trash"></i></button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    )}

                    {activeTab === 'Skills' && (
                        <div className="space-y-6">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 bg-slate-100 p-4 rounded-xl border border-slate-200">
                                <div className="space-y-1">
                                    <label className="text-xs font-bold text-slate-500">Tagline Kategori</label>
                                    <input type="text" value={formData.skillsInfo?.tag || 'COMPETENCIES'} onChange={e => handleNestedChange('skillsInfo', 'tag', e.target.value)} className="w-full border p-2 rounded text-xs" />
                                </div>
                                <div className="space-y-1">
                                    <label className="text-xs font-bold text-slate-500">Judul Utama</label>
                                    <input type="text" value={formData.skillsInfo?.title || 'SKILLS & EXPERTISE'} onChange={e => handleNestedChange('skillsInfo', 'title', e.target.value)} className="w-full border p-2 rounded text-xs" />
                                </div>
                                <div className="col-span-1 md:col-span-2 space-y-1">
                                    <label className="text-xs font-bold text-slate-500">Deskripsi Singkat</label>
                                    <textarea rows="2" value={formData.skillsInfo?.description || 'Kombinasi keahlian teknik industri, metodologi kualitas, dan kemampuan pemrograman web.'} onChange={e => handleNestedChange('skillsInfo', 'description', e.target.value)} className="w-full border p-2 rounded text-xs"></textarea>
                                </div>
                            </div>
                            <div className="p-4 bg-blue-50 text-blue-700 rounded-lg text-xs font-mono font-bold mb-4">
                                <i className="fa-solid fa-circle-info mr-2"></i> Pisahkan setiap skill dengan KOMA (,).
                            </div>
                            {['industrial', 'web', 'database', 'quality'].map(cat => (
                                <div key={cat} className="space-y-2">
                                    <label className="font-bold text-slate-700 uppercase tracking-widest text-xs">{cat} Skills</label>
                                    <textarea
                                        rows="2"
                                        value={(formData.skills?.[cat] || []).join(', ')}
                                        onChange={e => handleNestedChange('skills', cat, e.target.value.split(',').map(s => s.trim()).filter(Boolean))}
                                        className="w-full border p-2.5 rounded bg-slate-50 text-sm font-mono"
                                    ></textarea>
                                </div>
                            ))}
                        </div>
                    )}

                    {activeTab === 'Contact' && (
                        <div className="space-y-6">
                            <div className="grid grid-cols-2 gap-4">
                                <div className="space-y-2"><label className="font-bold text-slate-700">Email Utama</label><input type="email" value={formData.hero.email} onChange={e => handleNestedChange('hero', 'email', e.target.value)} className="w-full border p-2.5 rounded bg-slate-50" /></div>
                                <div className="space-y-2"><label className="font-bold text-slate-700">Nomor HP</label><input type="text" value={formData.hero.phone} onChange={e => handleNestedChange('hero', 'phone', e.target.value)} className="w-full border p-2.5 rounded bg-slate-50" /></div>
                                <div className="space-y-2 col-span-2"><label className="font-bold text-slate-700">Alamat / Lokasi</label><input type="text" value={formData.hero.location} onChange={e => handleNestedChange('hero', 'location', e.target.value)} className="w-full border p-2.5 rounded bg-slate-50" /></div>
                            </div>
                        </div>
                    )}
                  </div>
                </main>
              </div>
            </div>
          );
        };

        // ==========================================
        // SEGMENT 5: PUBLIC PORTFOLIO (NEW UI/UX)
        // ==========================================
        const PublicPortfolio = ({ data, setView }) => {
          const [activeProject, setActiveProject] = useState(null);
          const [showResume, setShowResume] = useState(false);

          // P + L shortcut to open Admin
          useEffect(() => {
            const keys = {};
            const down = e => { keys[e.key.toLowerCase()] = true; if(keys['p'] && keys['l']) setView('admin'); };
            const up = e => { keys[e.key.toLowerCase()] = false; };
            window.addEventListener('keydown', down); window.addEventListener('keyup', up);
            return () => { window.removeEventListener('keydown', down); window.removeEventListener('keyup', up); };
          }, [setView]);

          const renderList = (text) => {
              if(!text) return null;
              return text.split('\n').map((line, i) => <li key={i} className="mb-1">{line.replace('• ', '')}</li>);
          };

          // Kumpulkan semua gambar dari Pengalaman & Proyek untuk Carousel
          const carouselItems = [
              ...(data.experience || []).filter(e => e.documentationImage).map(e => ({ img: e.documentationImage, title: e.role, type: 'Pengalaman', link: '#experience' })),
              ...(data.projects || []).filter(p => p.coverImage).map(p => ({ img: p.coverImage, title: p.title, type: 'Proyek', link: '#projects' }))
          ];

          return (
            <div className="font-sans">
              
              {/* Navigation Header */}
              <header className="sticky top-0 z-40 w-full bg-brand-bg/90 backdrop-blur-md border-b border-slate-300/60">
                  <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
                      <a href="#" className="flex items-center gap-3 group">
                          <div className="w-10 h-10 rounded-full bg-brand-navy flex items-center justify-center text-white font-display font-black text-xl group-hover:bg-brand-orange transition-colors duration-300">
                              {data.hero.name.charAt(0)}
                          </div>
                          <div className="flex flex-col">
                              <span className="font-extrabold text-brand-navy text-sm tracking-tight font-display leading-tight">{data.hero.role}</span>
                              <span className="text-[10px] font-mono text-brand-orange font-bold uppercase tracking-widest">{data.hero.subRole}</span>
                          </div>
                      </a>
                      <nav className="hidden md:flex items-center gap-6 font-mono text-xs font-bold text-slate-700 uppercase">
                          <a href="#education" className="hover:text-brand-orange transition-colors">Pendidikan</a>
                          <a href="#experience" className="hover:text-brand-orange transition-colors">Pengalaman</a>
                          <a href="#projects" className="hover:text-brand-orange transition-colors">Projects</a>
                          <a href="#skills" className="hover:text-brand-orange transition-colors">Skills</a>
                      </nav>
                      <div className="flex items-center gap-4">
                          <a href="#contact" className="hidden sm:flex px-5 py-2.5 rounded-xl bg-brand-navy hover:bg-brand-orange text-white font-mono font-bold text-xs uppercase tracking-wider transition-all shadow-sm">
                              Let's Talk
                          </a>
                      </div>
                  </div>
              </header>

              {/* 1. HERO SECTION */}
              <section className="pt-6 pb-10 md:pt-10 md:pb-16 overflow-hidden">
                  <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                      <div className="mb-6 md:mb-8 animate-fade-in-up">
                          <h1 className="text-4xl sm:text-6xl md:text-7xl lg:text-[80px] font-display font-black tracking-tighter uppercase leading-[0.88] text-brand-navy">
                              <span className="text-brand-orange block">{data.hero.title1 || 'ENGINEERING'}</span>
                              <span>{data.hero.title2 || 'PORTFOLIO'}</span>
                          </h1>
                      </div>

                      <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 md:gap-8 items-center">
                          {/* Left Column */}
                          <div className="lg:col-span-7 space-y-6 md:space-y-8 animate-fade-in-up" style={{ animationDelay: '0.1s' }}>
                              <div className="space-y-3">
                                  <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-slate-200/80 text-brand-navy font-mono text-xs font-bold uppercase border border-slate-300">
                                      <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                      Available for Projects
                                  </div>
                                  <h2 className="text-2xl sm:text-3xl md:text-4xl font-extrabold text-brand-navy tracking-tight font-display">
                                      {data.hero.greeting}
                                  </h2>
                                  <p className="text-slate-700 text-sm sm:text-base md:text-lg leading-relaxed max-w-xl font-normal whitespace-pre-wrap">
                                      {data.hero.description}
                                  </p>
                              </div>

                              {/* STATS ROW */}
                              <div className="p-4 md:p-6 bg-white rounded-2xl border border-slate-300/80 shadow-sm relative">
                                  <div className="flex items-center justify-between pb-3 mb-3 border-b border-slate-200">
                                      <span className="text-[10px] md:text-[11px] font-mono font-bold uppercase tracking-widest text-slate-500">
                                          <i className="fa-solid fa-chart-line text-brand-orange mr-1.5"></i> METRIK & PENCAPAIAN
                                      </span>
                                  </div>
                                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 md:gap-6">
                                      {data.hero.stats.map((stat, idx) => (
                                          <div key={stat.id}>
                                              <div className={`text-2xl sm:text-3xl md:text-4xl font-display font-black ${idx % 2 === 0 ? 'text-brand-orange' : 'text-brand-navy'}`}>{stat.val}</div>
                                              <div className="text-[10px] sm:text-[11px] font-mono font-bold text-slate-600 uppercase mt-1 leading-tight">{stat.label}</div>
                                          </div>
                                      ))}
                                  </div>
                              </div>

                              {/* DYNAMIC GALLERY CAROUSEL (32:9 on desktop, 21:9 on mobile) */}
                              {carouselItems.length > 0 && (
                                  <div className="mt-6 pt-6 border-t border-slate-300/60 w-full relative">
                                      <p className="text-[10px] font-mono font-bold text-slate-500 mb-3 uppercase tracking-widest">GALERI & DOKUMENTASI KEGIATAN</p>
                                      <div className="w-full aspect-[21/9] sm:aspect-[32/9] relative overflow-hidden group rounded-xl bg-slate-900 shadow-lg border border-slate-200">
                                          <div className="flex absolute left-0 top-0 h-full animate-marquee hover:[animation-play-state:paused] w-max">
                                              {[...carouselItems, ...carouselItems].map((item, idx) => (
                                                  <a key={idx} href={item.link} className="h-full aspect-video flex-shrink-0 relative block mx-0.5 overflow-hidden cursor-pointer group/item">
                                                      <div className="absolute inset-0 bg-brand-navy/50 group-hover/item:bg-transparent transition-colors duration-500 z-10"></div>
                                                      <img src={item.img} alt={item.title} className="w-full h-full object-cover" />
                                                      <div className="absolute bottom-2 left-3 right-3 z-20 pointer-events-none group-hover/item:opacity-0 transition-opacity">
                                                          <span className="px-1.5 py-0.5 bg-brand-orange text-white text-[9px] font-mono font-bold uppercase rounded shadow-sm">{item.type}</span>
                                                          <h3 className="text-white font-display font-bold text-[10px] sm:text-xs mt-1 truncate drop-shadow-md">{item.title}</h3>
                                                      </div>
                                                  </a>
                                              ))}
                                          </div>
                                      </div>
                                  </div>
                              )}

                              <div className="flex flex-wrap items-center gap-3 md:gap-4 mt-6">
                                  <a href="#projects" className="px-6 md:px-7 py-3 md:py-3.5 rounded-xl bg-brand-navy hover:bg-brand-orange text-white font-bold text-xs uppercase tracking-wider transition-all shadow-md flex items-center gap-2">
                                      <span>LIHAT PORTOFOLIO</span><i className="fa-solid fa-arrow-down-long text-xs"></i>
                                  </a>
                                  <button onClick={() => setShowResume(true)} className="px-6 md:px-7 py-3 md:py-3.5 rounded-xl bg-white border border-slate-300 hover:border-slate-400 text-brand-navy font-bold text-xs uppercase tracking-wider transition-all shadow-sm flex items-center gap-2">
                                      <i className="fa-solid fa-file-arrow-down text-brand-orange"></i><span>UNDUH CV</span>
                                  </button>
                              </div>
                          </div>

                          {/* Right Column: Photo */}
                          <div className="lg:col-span-5 relative flex justify-center animate-fade-in-up" style={{ animationDelay: '0.2s' }}>
                              <div className="relative w-full max-w-md aspect-[4/5]">
                                  <div className="absolute -right-4 -bottom-4 w-72 h-72 sm:w-80 sm:h-80 bg-brand-orange rounded-full pointer-events-none opacity-90"></div>
                                  <div className="relative z-10 w-full h-full rounded-[2.5rem] bg-brand-navy border-4 border-white shadow-2xl overflow-hidden group">
                                      <img src={data.hero.photoUrl} alt={data.hero.name} 
                                          className="w-full h-full object-cover object-center filter saturate-90 contrast-105 group-hover:scale-105 transition-transform duration-700"
                                          style={{ objectPosition: `${data.hero.photoSettings?.posX || 50}% ${data.hero.photoSettings?.posY || 50}%`, transform: `scale(${(data.hero.photoSettings?.zoom || 100) / 100})` }} 
                                      />
                                      <div className="absolute bottom-4 left-4 right-4 p-4 rounded-2xl bg-brand-navy/90 backdrop-blur-md border border-white/20 text-white font-mono text-xs space-y-1">
                                          <div className="flex items-center justify-between text-slate-300">
                                              <span className="font-bold text-brand-orange uppercase">{data.hero.name}, S.T.</span>
                                              <span>{new Date().getFullYear()}</span>
                                          </div>
                                          <div className="text-[11px] text-slate-300 truncate">{data.hero.role}</div>
                                      </div>
                                  </div>
                                  <div className="absolute top-6 -left-6 z-20 px-4 py-3 rounded-2xl bg-white border border-slate-300 shadow-xl hidden sm:flex items-center gap-3">
                                      <div className="w-9 h-9 rounded-xl bg-brand-orange/10 text-brand-orange flex items-center justify-center font-bold text-base">
                                          <i className="fa-solid fa-gear"></i>
                                      </div>
                                      <div className="font-mono text-xs">
                                          <div className="font-bold text-brand-navy">SYSTEM OPTIMIZER</div>
                                          <div className="text-slate-500 text-[10px]">Industrial & Code</div>
                                      </div>
                                  </div>
                              </div>
                          </div>
                      </div>
                  </div>
              </section>

              {/* 2. EDUCATION & CERTIFICATION */}
              <section id="education" className="py-12 md:py-16 border-t border-slate-300/80">
                  <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                      <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 md:gap-10">
                          
                          <div className="lg:col-span-7 space-y-6">
                              <div>
                                  <span className="text-brand-orange text-xs font-mono font-bold uppercase tracking-widest">ACADEMIC CREDENTIALS</span>
                                  <h2 className="text-2xl sm:text-3xl font-display font-black text-brand-navy uppercase tracking-tight mt-1">PENDIDIKAN</h2>
                              </div>
                              {data.educations.map(edu => (
                                  <div key={edu.id} className="p-5 md:p-6 rounded-2xl bg-white border border-slate-300/80 card-shadow space-y-5">
                                      <div className="flex items-start justify-between">
                                          <div className="flex gap-3 md:gap-4">
                                              {edu.logo ? (
                                                  <div className="w-14 h-14 md:w-16 md:h-16 rounded-xl bg-white shadow-sm border border-slate-200 flex items-center justify-center p-2 flex-shrink-0">
                                                      <img src={edu.logo} alt={edu.name} className="w-full h-full object-contain" />
                                                  </div>
                                              ) : (
                                                  <div className="w-14 h-14 md:w-16 md:h-16 rounded-xl bg-slate-100 text-brand-navy flex items-center justify-center text-xl md:text-2xl flex-shrink-0"><i className="fa-solid fa-graduation-cap"></i></div>
                                              )}
                                              <div>
                                                  <span className="px-3 py-1 rounded-full bg-brand-orange text-white text-[9px] sm:text-[10px] font-mono font-bold uppercase">{edu.period}</span>
                                                  <h3 className="text-xl sm:text-2xl font-bold text-brand-navy font-display mt-2 sm:mt-3">{edu.role}</h3>
                                                  <p className="text-brand-orange font-mono text-xs sm:text-sm font-bold mt-1">{edu.name}</p>
                                              </div>
                                          </div>
                                      </div>
                                      <div className="p-4 md:p-5 rounded-xl bg-brand-bg border border-slate-300/80 flex items-center justify-between">
                                          <div>
                                              <div className="text-[10px] sm:text-xs font-mono text-slate-500 uppercase font-bold">Indeks Prestasi Kumulatif (IPK)</div>
                                              <div className="text-3xl sm:text-4xl font-display font-black text-brand-navy mt-1">{edu.info} <span className="text-[10px] sm:text-xs text-slate-500 font-sans font-normal">/ 4.00</span></div>
                                          </div>
                                          <div className="text-right">
                                              <span className="inline-block px-2 sm:px-3 py-1 rounded-md bg-emerald-100 text-emerald-800 text-[9px] sm:text-[10px] font-mono font-bold">
                                                  <i className="fa-solid fa-star text-emerald-600 mr-1"></i>Predikat Pujian
                                              </span>
                                          </div>
                                      </div>
                                      <p className="text-slate-600 text-xs sm:text-sm leading-relaxed">{edu.focus}</p>
                                  </div>
                              ))}
                          </div>

                          <div className="lg:col-span-5 space-y-6">
                              <div>
                                  <span className="text-brand-orange text-xs font-mono font-bold uppercase tracking-widest">PROFESSIONAL LICENSES</span>
                                  <h2 className="text-2xl sm:text-3xl font-display font-black text-brand-navy uppercase tracking-tight mt-1">SERTIFIKASI</h2>
                              </div>
                              <div className="space-y-4">
                                  {data.certifications.map((cert, idx) => (
                                      <div key={cert.id} className={`p-5 md:p-6 rounded-2xl ${idx === 0 ? 'bg-brand-navy text-white shadow-lg' : 'bg-white border border-slate-300/80 card-shadow'} space-y-3`}>
                                          <div className={`flex items-center justify-between ${idx === 0 ? 'text-brand-orange' : 'text-brand-navy'} font-mono text-[10px] sm:text-xs font-bold`}>
                                              <span>{cert.type}</span><i className={`fa-solid ${cert.icon} text-base sm:text-lg`}></i>
                                          </div>
                                          <h3 className={`font-display font-bold text-sm sm:text-base ${idx === 0 ? '' : 'text-brand-navy'}`}>{cert.name}</h3>
                                          <p className={`${idx === 0 ? 'text-slate-300' : 'text-slate-600'} text-[11px] sm:text-xs leading-relaxed`}>{cert.desc}</p>
                                      </div>
                                  ))}
                              </div>
                          </div>

                      </div>
                  </div>
              </section>

              {/* 3. EXPERIENCE SECTION */}
              <section id="experience" className="py-12 md:py-16 border-t border-slate-300/80 bg-white">
                  <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-6 md:space-y-8">
                      <div>
                          <span className="text-brand-orange text-xs font-mono font-bold uppercase tracking-widest">CAREER HISTORY</span>
                          <h2 className="text-2xl sm:text-3xl md:text-4xl font-display font-black text-brand-navy uppercase tracking-tight mt-1">PENGALAMAN KERJA</h2>
                      </div>
                      <div className="space-y-5 md:space-y-6">
                          {data.experience.map(exp => (
                              <div key={exp.id} className="p-5 md:p-6 rounded-2xl bg-brand-bg border border-slate-300/80 space-y-4 card-shadow">
                                  <div className="flex flex-col md:flex-row md:items-center justify-between gap-3 border-b border-slate-300/60 pb-3 md:pb-4">
                                      <div className="flex items-center gap-3 md:gap-4">
                                          {exp.companyLogo ? (
                                              <div className="w-12 h-12 md:w-14 md:h-14 bg-white rounded-xl shadow-sm border border-slate-200 flex items-center justify-center p-1.5 flex-shrink-0">
                                                  <img src={exp.companyLogo} alt={exp.company} className="w-full h-full object-contain" />
                                              </div>
                                          ) : (
                                              <div className="w-12 h-12 md:w-14 md:h-14 rounded-xl bg-slate-100 flex items-center justify-center text-slate-400 flex-shrink-0 border border-slate-200"><i className="fa-solid fa-building text-lg md:text-xl"></i></div>
                                          )}
                                          <div>
                                              <h3 className="text-lg md:text-xl font-bold text-brand-navy font-display">{exp.role}</h3>
                                              <p className={`${exp.color || 'text-brand-orange'} font-mono text-xs md:text-sm font-bold mt-0.5`}>{exp.company}</p>
                                          </div>
                                      </div>
                                      <span className="px-3 py-1.5 rounded-lg bg-white text-slate-700 text-[10px] sm:text-xs font-mono font-bold border border-slate-300 self-start md:self-auto">
                                          <i className={`fa-regular ${exp.icon || 'fa-calendar-check'} mr-1.5 ${exp.color || 'text-brand-orange'}`}></i>{exp.period}
                                      </span>
                                  </div>
                                  <ul className="space-y-1 md:space-y-2 text-slate-700 text-xs sm:text-sm leading-relaxed list-disc list-inside mt-3 md:mt-4">
                                      {renderList(exp.description)}
                                  </ul>
                                  {exp.documentationImage && (
                                      <div className="mt-4 md:mt-6 pt-2">
                                          <img src={exp.documentationImage} alt={`Dokumentasi ${exp.company}`} className="w-full max-w-sm max-h-32 md:max-h-48 object-cover rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow" />
                                      </div>
                                  )}
                              </div>
                          ))}
                      </div>
                  </div>
              </section>

              {/* 4. PROJECTS SECTION */}
              <section id="projects" className="py-12 md:py-16 border-t border-slate-300/80 bg-slate-50">
                  <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-8">
                      <div className="flex flex-col md:flex-row md:items-end justify-between gap-3 border-b border-slate-200 pb-5">
                          <div>
                              <div className="text-brand-orange text-xs font-mono font-bold uppercase tracking-widest mb-1">SELECTED WORK</div>
                              <h2 className="text-2xl sm:text-3xl md:text-4xl font-display font-black text-brand-navy tracking-tight uppercase">FEATURED PROJECTS</h2>
                          </div>
                      </div>
                      
                      <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 sm:gap-6">
                          {data.projects.map((proj, idx) => (
                              <div key={proj.id} className="bg-white rounded-2xl border border-slate-300/80 overflow-hidden card-shadow flex flex-col justify-between group">
                                  
                                  {/* Dynamic Cover Header */}
                                  <div className={`relative h-40 sm:h-48 ${proj.coverImage ? '' : (proj.colorTheme || 'bg-brand-navy')} flex flex-col justify-between overflow-hidden group-hover:scale-[1.02] transition-transform duration-500`}
                                       style={proj.coverImage ? {backgroundImage: `url(${proj.coverImage})`, backgroundSize: 'cover', backgroundPosition: 'center'} : {}}>
                                      {proj.coverImage && (
                                          <div className="absolute inset-0 bg-brand-navy/60 group-hover:bg-brand-navy/40 transition-colors z-0"></div>
                                      )}
                                      <div className="relative z-10 p-5 sm:p-6 flex flex-col h-full justify-between">
                                          <div className={`absolute top-0 left-0 ${idx % 2 === 0 ? 'bg-brand-orange text-white' : 'bg-brand-navy text-white'} font-display font-black text-lg sm:text-xl px-3 sm:px-4 py-2 sm:py-2.5 rounded-br-2xl shadow-md`}>
                                              0{idx + 1}
                                          </div>
                                          <div className="text-right font-mono text-[9px] sm:text-[10px] text-white/90 uppercase tracking-widest pt-1">{proj.client}</div>
                                          
                                          <div className="my-auto text-center font-mono mt-4">
                                              {!proj.coverImage && (
                                                  <div className="w-10 h-10 sm:w-12 sm:h-12 rounded-xl bg-white/10 mx-auto flex items-center justify-center text-lg sm:text-xl mb-2 border border-white/20 text-white">
                                                      <i className={`fa-solid ${proj.icon || 'fa-box'}`}></i>
                                                  </div>
                                              )}
                                              <span className={`text-[10px] sm:text-xs font-semibold ${proj.coverImage ? 'text-white sm:text-lg drop-shadow-md' : 'text-white'}`}>{proj.title.split(' ').slice(0, 3).join(' ')}...</span>
                                          </div>
                                      </div>
                                  </div>

                                  <div className="p-5 sm:p-6 space-y-4 flex-grow flex flex-col justify-between">
                                      <div>
                                          <span className="text-[9px] sm:text-[10px] font-mono font-bold text-brand-orange uppercase tracking-wider">{proj.category}</span>
                                          <h3 className="text-lg sm:text-xl font-display font-bold text-brand-navy group-hover:text-brand-orange transition-colors mt-1">{proj.title}</h3>
                                          <p className="text-slate-600 text-xs sm:text-sm mt-2 leading-relaxed line-clamp-3">{proj.summary}</p>
                                      </div>
                                      <div className="pt-4 border-t border-slate-300/60 flex items-center justify-between">
                                          <span className="text-[10px] sm:text-[11px] font-mono text-slate-500 truncate mr-2">{proj.tools}</span>
                                          <button onClick={() => setActiveProject(proj)} className="w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-slate-100 text-brand-navy group-hover:bg-brand-orange group-hover:text-white flex items-center justify-center transition-colors shadow-sm flex-shrink-0">
                                              <i className="fa-solid fa-arrow-right text-[10px] sm:text-xs"></i>
                                          </button>
                                      </div>
                                  </div>
                              </div>
                          ))}
                      </div>
                  </div>
              </section>

              {/* 5. SKILLS SECTION */}
              <section id="skills" className="py-12 md:py-16 border-t border-slate-300/80 bg-white">
                  <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-6 md:space-y-8">
                      <div className="max-w-2xl">
                          <span className="text-brand-orange text-xs font-mono font-bold uppercase tracking-widest">{data.skillsInfo?.tag || 'COMPETENCIES'}</span>
                          <h2 className="text-2xl sm:text-3xl md:text-4xl font-display font-black text-brand-navy uppercase tracking-tight mt-1">{data.skillsInfo?.title || 'SKILLS & EXPERTISE'}</h2>
                          <p className="text-slate-600 text-xs sm:text-sm mt-2">{data.skillsInfo?.description || 'Kombinasi keahlian teknik industri, metodologi kualitas, dan kemampuan pemrograman web.'}</p>
                      </div>
                      
                      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6">
                          <div className="bg-slate-50 p-5 md:p-6 rounded-2xl border border-slate-200 card-shadow space-y-3">
                              <div className="w-10 h-10 md:w-12 md:h-12 rounded-xl bg-brand-orange/10 text-brand-orange flex items-center justify-center text-lg md:text-xl"><i className="fa-solid fa-gears"></i></div>
                              <h3 className="font-display font-bold text-brand-navy text-base md:text-lg leading-tight">Industrial Engineering</h3>
                              <div className="flex flex-wrap gap-2 pt-2">
                                  {(data.skills?.industrial || []).map(s => <span key={s} className="px-2 md:px-3 py-1 md:py-1.5 rounded-lg bg-white border border-slate-200 text-slate-700 font-mono text-[9px] md:text-[10px] font-semibold">{s}</span>)}
                              </div>
                          </div>
                          <div className="bg-slate-50 p-5 md:p-6 rounded-2xl border border-slate-200 card-shadow space-y-3">
                              <div className="w-10 h-10 md:w-12 md:h-12 rounded-xl bg-brand-navy/10 text-brand-navy flex items-center justify-center text-lg md:text-xl"><i className="fa-solid fa-code"></i></div>
                              <h3 className="font-display font-bold text-brand-navy text-base md:text-lg leading-tight">Web & Software Dev</h3>
                              <div className="flex flex-wrap gap-2 pt-2">
                                  {(data.skills?.web || []).map(s => <span key={s} className="px-2 md:px-3 py-1 md:py-1.5 rounded-lg bg-white border border-slate-200 text-slate-700 font-mono text-[9px] md:text-[10px] font-semibold">{s}</span>)}
                              </div>
                          </div>
                          <div className="bg-slate-50 p-5 md:p-6 rounded-2xl border border-slate-200 card-shadow space-y-3">
                              <div className="w-10 h-10 md:w-12 md:h-12 rounded-xl bg-brand-orange/10 text-brand-orange flex items-center justify-center text-lg md:text-xl"><i className="fa-solid fa-database"></i></div>
                              <h3 className="font-display font-bold text-brand-navy text-base md:text-lg leading-tight">Databases & Cloud</h3>
                              <div className="flex flex-wrap gap-2 pt-2">
                                  {(data.skills?.database || []).map(s => <span key={s} className="px-2 md:px-3 py-1 md:py-1.5 rounded-lg bg-white border border-slate-200 text-slate-700 font-mono text-[9px] md:text-[10px] font-semibold">{s}</span>)}
                              </div>
                          </div>
                          <div className="bg-slate-50 p-5 md:p-6 rounded-2xl border border-slate-200 card-shadow space-y-3">
                              <div className="w-10 h-10 md:w-12 md:h-12 rounded-xl bg-brand-navy/10 text-brand-navy flex items-center justify-center text-lg md:text-xl"><i className="fa-solid fa-chart-line"></i></div>
                              <h3 className="font-display font-bold text-brand-navy text-base md:text-lg leading-tight">Quality & Cont. Imp.</h3>
                              <div className="flex flex-wrap gap-2 pt-2">
                                  {(data.skills?.quality || []).map(s => <span key={s} className="px-2 md:px-3 py-1 md:py-1.5 rounded-lg bg-white border border-slate-200 text-slate-700 font-mono text-[9px] md:text-[10px] font-semibold">{s}</span>)}
                              </div>
                          </div>
                      </div>
                  </div>
              </section>

              {/* FOOTER */}
              <footer id="contact" className="relative z-10 border-t border-slate-300 bg-white">
                  <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
                      <div className="relative rounded-3xl bg-brand-navy text-white p-8 sm:p-12 overflow-hidden shadow-2xl">
                          <div className="absolute -right-16 -bottom-16 w-72 h-72 bg-brand-orange rounded-full pointer-events-none opacity-90"></div>
                          <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-center relative z-10">
                              <div className="lg:col-span-5 space-y-4">
                                  <h2 className="text-3xl sm:text-4xl font-display font-black uppercase tracking-tight leading-tight">
                                      LET'S CREATE <br/><span className="text-brand-orange">SOMETHING</span> <br/>EXTRAORDINARY!
                                  </h2>
                                  <p className="text-slate-300 text-xs sm:text-sm leading-relaxed">Terbuka untuk kesempatan karir Teknik Industri, perancangan sistem produksi, dan pengembangan software industri.</p>
                              </div>
                              <div className="lg:col-span-4 space-y-3 font-mono text-xs text-slate-200">
                                  <div className="text-brand-orange font-bold uppercase tracking-wider">HUBUNGI SAYA</div>
                                  <div className="flex items-center gap-3"><i className="fa-solid fa-envelope text-brand-orange"></i><span>{data.hero.email}</span></div>
                                  <div className="flex items-center gap-3"><i className="fa-solid fa-phone text-brand-orange"></i><span>{data.hero.phone}</span></div>
                                  <div className="flex items-center gap-3"><i className="fa-solid fa-location-dot text-brand-orange"></i><span>{data.hero.location}</span></div>
                              </div>
                              <div className="lg:col-span-3 flex flex-col items-start lg:items-end justify-center space-y-4">
                                  <div className="text-xs font-mono font-bold text-white uppercase tracking-wider">MEDIA SOSIAL</div>
                                  <div className="flex items-center gap-3">
                                      <a href="#" className="w-10 h-10 rounded-full bg-white/10 hover:bg-brand-orange text-white flex items-center justify-center transition-colors"><i className="fa-brands fa-linkedin-in"></i></a>
                                      <a href="#" className="w-10 h-10 rounded-full bg-white/10 hover:bg-brand-orange text-white flex items-center justify-center transition-colors"><i className="fa-brands fa-github"></i></a>
                                  </div>
                              </div>
                          </div>
                      </div>
                      <div className="pt-8 flex flex-col sm:flex-row items-center justify-between text-xs font-mono text-slate-500 gap-4">
                          <div>© {new Date().getFullYear()} {data.hero.name} All Rights Reserved.</div>
                      </div>
                  </div>
              </footer>

              {/* PROJECT DETAIL MODAL */}
              {activeProject && (
                  <div className="fixed inset-0 z-50 bg-brand-navy/60 backdrop-blur-sm flex items-center justify-center p-4">
                      <div className="bg-white rounded-2xl p-6 md:p-8 max-w-xl w-full space-y-6 shadow-2xl border border-slate-300 max-h-[90vh] overflow-y-auto animate-fade-in-up">
                          <div className="flex items-start justify-between border-b border-slate-200 pb-4">
                              <div>
                                  <span className="text-xs font-mono font-bold text-brand-orange">{activeProject.category}</span>
                                  <h3 className="text-brand-navy font-display font-bold text-2xl mt-0.5">{activeProject.title}</h3>
                              </div>
                              <button onClick={() => setActiveProject(null)} className="text-slate-400 hover:text-slate-700 p-1">
                                  <i className="fa-solid fa-xmark text-xl"></i>
                              </button>
                          </div>
                          {activeProject.coverImage && (
                              <div className="w-full h-48 rounded-xl overflow-hidden shadow-sm">
                                  <img src={activeProject.coverImage} alt={activeProject.title} className="w-full h-full object-cover" />
                              </div>
                          )}
                          <div className="space-y-4 text-slate-700 text-xs sm:text-sm leading-relaxed font-sans">
                              {activeProject.detail?.background && <p><strong>Latar Belakang:</strong><br/>{activeProject.detail.background}</p>}
                              {activeProject.detail?.scope && (
                                  <div className="p-4 rounded-xl bg-slate-50 border border-slate-300 font-mono text-xs text-brand-navy space-y-1">
                                      {renderList(activeProject.detail.scope)}
                                  </div>
                              )}
                              {activeProject.detail?.results && <p><strong>Hasil:</strong><br/>{activeProject.detail.results}</p>}
                          </div>
                          <div className="flex items-center justify-end pt-4 border-t border-slate-200">
                              <button onClick={() => setActiveProject(null)} className="px-6 py-2.5 rounded-xl bg-brand-navy text-white font-bold text-xs uppercase font-mono hover:bg-brand-orange transition-colors">Tutup Detail</button>
                          </div>
                      </div>
                  </div>
              )}

              {/* RESUME MODAL */}
              {showResume && (
                  <div className="fixed inset-0 z-50 bg-brand-navy/60 backdrop-blur-sm flex items-center justify-center p-4">
                      <div className="bg-white rounded-2xl p-6 max-w-md w-full space-y-6 shadow-2xl border border-slate-300 animate-fade-in-up">
                          <div className="flex items-center justify-between border-b border-slate-200 pb-4">
                              <div className="flex items-center gap-2">
                                  <i className="fa-solid fa-file-pdf text-brand-orange"></i>
                                  <h3 className="font-display font-bold text-brand-navy text-lg">CURRICULUM VITAE</h3>
                              </div>
                              <button onClick={() => setShowResume(false)} className="text-slate-400 hover:text-slate-700 p-1">
                                  <i className="fa-solid fa-xmark text-lg"></i>
                              </button>
                          </div>
                          <div className="space-y-3 text-slate-600 text-xs sm:text-sm">
                              <p>Dokumen Curriculum Vitae lengkap untuk <strong className="text-brand-navy">{data.hero.name}</strong></p>
                              <div className="p-4 rounded-xl bg-slate-50 border border-slate-300 font-mono text-xs space-y-1 text-slate-700">
                                  <div>• Pendidikan: S1 Teknik Industri</div>
                                  <div>• Keahlian Utama: Industrial System & Code</div>
                              </div>
                          </div>
                          <div className="flex items-center justify-end gap-3 pt-4 border-t border-slate-200">
                              <button onClick={() => setShowResume(false)} className="px-4 py-2 rounded-lg bg-slate-100 text-slate-700 font-mono text-xs font-bold">Batal</button>
                              <button onClick={() => { alert('Fungsi download CV dapat disambungkan ke link G-Drive Anda.'); setShowResume(false); }} className="px-5 py-2 rounded-lg bg-brand-orange text-white font-mono font-bold text-xs hover:bg-brand-orangeDark transition-colors flex items-center gap-2">
                                  <i className="fa-solid fa-download"></i><span>Unduh CV</span>
                              </button>
                          </div>
                      </div>
                  </div>
              )}
            </div>
          );
        };

        // ==========================================
        // SEGMENT 6: APP WRAPPER & FIREBASE
        // ==========================================
        const App = () => {
          const [view, setView] = useState('public');
          const [portfolioData, setPortfolioData] = useState(initialData);
          const [db, setDb] = useState(null);
          const [fbApi, setFbApi] = useState(null);

          useEffect(() => {
            const initFirebase = async () => {
              try {
                const { initializeApp } = await import('https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js');
                const { getFirestore, doc, onSnapshot, setDoc, getDoc } = await import('https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js');
                
                setFbApi({ doc, setDoc });
                
                const firebaseConfig = {
                  apiKey: "AIzaSyB0gq5a09YMfxIHCDJUa833CuS6JM4-r0M",
                  authDomain: "portooooo-8ffd1.firebaseapp.com",
                  projectId: "portooooo-8ffd1",
                  storageBucket: "portooooo-8ffd1.firebasestorage.app",
                  messagingSenderId: "806835327046",
                  appId: "1:806835327046:web:3e2a28f0a806291200ba47",
                  measurementId: "G-4NHWXXMKMH"
                };

                const firestoreDb = getFirestore(initializeApp(firebaseConfig));
                setDb(firestoreDb);
                const docRef = doc(firestoreDb, 'portfolio_v2', 'main_data'); // Changed doc name to avoid conflicting old data structure
                
                const docSnap = await getDoc(docRef);
                if (!docSnap.exists()) await setDoc(docRef, initialData);

                onSnapshot(docRef, (snap) => {
                  if (snap.exists()) setPortfolioData(snap.data());
                });
              } catch (e) { console.error(e); }
            };
            initFirebase();
          }, []);

          const handleSaveData = async (newData) => {
            // Mencegah Silent Fail jika ukuran file meledak melebihi batas Firebase
            const sizeInBytes = new Blob([JSON.stringify(newData)]).size;
            if (sizeInBytes > 950000) { 
                throw new Error(`Ukuran total data terlalu besar (${(sizeInBytes/1024/1024).toFixed(2)} MB). Batas Firebase adalah 1MB. Hapus beberapa foto dokumentasi proyek.`);
            }

            if (db && fbApi) await fbApi.setDoc(fbApi.doc(db, 'portfolio_v2', 'main_data'), newData);
            setPortfolioData(newData);
          };

          return view === 'public' 
            ? <PublicPortfolio data={portfolioData} setView={setView} />
            : <AdminDashboard data={portfolioData} setData={handleSaveData} setView={setView} />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
